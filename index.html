
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPSEN - Portail Clients</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#183047}
header{background:#123b5d;color:white;padding:22px}
main{max-width:850px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 15px #0001}
h1{margin-top:0}p{color:#637386;line-height:1.6}
input{display:block;width:100%;box-sizing:border-box;padding:13px;margin:10px 0;border:1px solid #ccd5df;border-radius:7px}
button{background:#147d64;color:white;border:0;padding:13px 18px;border-radius:7px;font-weight:bold}
footer{text-align:center;padding:25px;color:#637386;font-size:13px}
</style>
</head>
<body>
<header>
<h2>IPSEN | PORTAIL CLIENTS</h2>
<div>Suivi du stock et des opérations logistiques</div>
</header>
<main>
<section class="card">
<h1>Bienvenue sur votre portail</h1>
<p>Consultez vos informations logistiques depuis un espace sécurisé.</p>
<h3>Connexion client</h3>
<form id="login">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" placeholder="Votre e-mail" required>
<label for="password">Mot de passe</label>
<input id="password" type="password" placeholder="Votre mot de passe" required>
<button type="submit">Se connecter</button>
<p id="message"></p>
</form>
</section>
</main>
<footer>IPSEN Logistics — Portail de consultation du stock</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  "https://lyzxhpkpboqsluuyrypr.supabase.co",
  "sb_publishable_4FS53EVOwmQ9GHyPB241mA_5JE64o12"
);

const form = document.getElementById("login");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "Connexion...";

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = "Erreur : vérifiez votre e-mail et mot de passe.";
    return;
  }

  const { data: profile, error: pError } = await sb
    .from("profiles")
    .select("role, client_id")
    .eq("id", data.user.id)
    .single();

  if (pError || !profile) {
    message.textContent = "Profil introuvable.";
    await sb.auth.signOut();
    return;
  }

  if (profile.role !== "admin") {
    message.textContent = "Espace client : le tableau client sera ajouté ensuite.";
    return;
  }

  form.style.display = "none";
  document.querySelector("h3").style.display = "none";
  message.textContent = "";

  const panel = document.createElement("section");
  panel.className = "card";
  panel.innerHTML = `
    <h1>Dashboard Admin</h1>
    <p>IPSEN Logistics — Gestion du stock</p>
    <div id="stats">Chargement des données...</div>
    <h3>Recherche du stock</h3>
    <input id="search" placeholder="Rechercher ESC, RUB ou client">
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr>
            <th>Client</th><th>ESC</th><th>RUB</th>
            <th>Date entrée</th><th>Colis</th>
            <th>Poids brut (kg)</th><th>Statut</th>
          </tr>
        </thead>
        <tbody id="stockRows"></tbody>
      </table>
    </div>
    <p id="count"></p>
    <button id="logout">Se déconnecter</button>
  `;

  document.querySelector("main").appendChild(panel);

  const stats = panel.querySelector("#stats");
  const rowsEl = panel.querySelector("#stockRows");
  const search = panel.querySelector("#search");
  const count = panel.querySelector("#count");

  const [clientsResult, stockResult] = await Promise.all([
    sb.from("clients").select("id,name").order("name"),
    sb.from("stock_records")
      .select("client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie")
      .order("date_entree", { ascending: false })
  ]);

  if (clientsResult.error || stockResult.error) {
    stats.textContent = "Erreur de chargement. Vérifiez les droits RLS et les colonnes.";
    return;
  }

  const clients = clientsResult.data || [];
  const records = stockResult.data || [];
  const clientNames = Object.fromEntries(
    clients.map(c => [c.id, c.name])
  );

  const totalColis = records.reduce(
    (sum, r) => sum + (Number(r.colis) || 0), 0
  );
  const totalWeight = records.reduce(
    (sum, r) => sum + (Number(r.poids_brut) || 0), 0
  );

  stats.innerHTML = `
    <p><b>Clients :</b> ${clients.length}</p>
    <p><b>Opérations :</b> ${records.length}</p>
    <p><b>Total colis :</b> ${totalColis.toLocaleString("fr-FR")}</p>
    <p><b>Poids brut :</b> ${totalWeight.toLocaleString("fr-FR")} kg</p>
  `;

  function renderRows() {
    const q = search.value.trim().toLowerCase();
    const filtered = records.filter(r => [
      clientNames[r.client_id] || "",
      r.esc || "", r.rub || "", r.statut || ""
    ].some(v => String(v).toLowerCase().includes(q)));

    rowsEl.replaceChildren();

    filtered.forEach(r => {
      const tr = document.createElement("tr");
      [
        clientNames[r.client_id] || "Client non associé",
        r.esc, r.rub, r.date_entree,
        r.colis, r.poids_brut, r.statut
      ].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        td.style.padding = "8px";
        td.style.borderBottom = "1px solid #ddd";
        tr.appendChild(td);
      });
      rowsEl.appendChild(tr);
    });

    count.textContent = `${filtered.length} opération(s) affichée(s)`;
  }

  search.addEventListener("input", renderRows);
  renderRows();

  panel.querySelector("#logout").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });
});
  </script>
  
  
</body>
</html>
