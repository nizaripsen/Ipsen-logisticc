  <script>
const sb = window.supabase.createClient(
  "https://lyzxhpkpboqsluuyrypr.supabase.co",
  "sb_publishable_4FS53EVOwmQ9GHyPB241mA_5JE64o12"
);
const form = document.getElementById("login");
const message = document.getElementById("message");

function addLogout(panel) {
  const btn = panel.querySelector("#logout");
  btn.addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });
}
function cell(value) {
  const td = document.createElement("td");
  td.style.cssText = "padding:9px;border-bottom:1px solid #e2e8f0;white-space:nowrap";
  if (value && typeof value === "object" && value.badge === true) {
    const badge = document.createElement("span");
    badge.className = value.done ? "badge badge-done" : "badge";
    badge.textContent = value.text || "En cours";
    td.appendChild(badge);
  } else {
    td.textContent = value == null ? "" : String(value);
  }
  return td;
}
function showTable(panel, records, clientNames, admin, reloadData, user, staff=false) {
  const rows=panel.querySelector("#stockRows"), search=panel.querySelector("#search"), statusFilter=panel.querySelector("#statusFilter"), count=panel.querySelector("#count");
  const clientFilter=panel.querySelector("#clientFilter"), dateFilter=panel.querySelector("#dateFilter"), sortFilter=panel.querySelector("#sortFilter");
  function render(){
    const q=search.value.trim().toLowerCase(), wanted=statusFilter.value, clientWanted=clientFilter?.value||"", dateWanted=dateFilter?.value||"";
    let filtered=records.filter(r=>[clientNames[r.client_id]||"",r.esc||"",r.rub||"",r.statut||"",r.date_entree||"",r.date_sortie||""].some(v=>String(v).toLowerCase().includes(q))
      &&(!wanted||(wanted==="livree"?/livr/i.test(r.statut||""):! /livr/i.test(r.statut||"")))
      &&(!clientWanted||r.client_id===clientWanted)&&(!dateWanted||r.date_entree===dateWanted));
    filtered.sort((a,b)=>String(a.date_entree||"").localeCompare(String(b.date_entree||""))*(sortFilter?.value==="asc"?1:-1));
    rows.replaceChildren();
    filtered.forEach(r=>{const tr=document.createElement("tr");
      const vals=admin?[clientNames[r.client_id]||"Client non associé",r.esc,r.rub,r.date_entree,r.colis,r.poids_brut,{badge:true,text:r.statut||"En cours",done:/livr/i.test(r.statut||"")},r.date_sortie||"—"]:[r.esc,r.rub,r.date_entree,r.colis,r.poids_brut,{badge:true,text:r.statut||"En cours",done:/livr/i.test(r.statut||"")},r.date_sortie||"—"];
      vals.forEach(v=>tr.appendChild(cell(v)));
      const actionTd=document.createElement("td");
      if(admin){
        const mark=document.createElement("button");mark.className="btn-green";mark.textContent=/livr/i.test(r.statut||"")?"✓ Livrée":"✓ Marquer comme livrée";mark.disabled=/livr/i.test(r.statut||"");
        mark.addEventListener("click",async()=>{if(!confirm(`Marquer l'escale ${r.esc} comme livrée ?`))return;mark.disabled=true;const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const {error}=await sb.from("stock_records").update({statut:"Livrée",date_sortie:today}).eq("esc",r.esc).eq("client_id",r.client_id);if(error){alert("Erreur Supabase : "+error.message);mark.disabled=false;return;}await reloadData();});actionTd.appendChild(mark);
        const edit=document.createElement("button");edit.className="btn-light";edit.textContent="✏️ Modifier";edit.addEventListener("click",async()=>{
          const esc=prompt("Numéro ESC :",r.esc||"");if(esc===null)return;if(!esc.trim()){alert("Le numéro ESC est obligatoire.");return;}
          const rub=prompt("Référence RUB :",r.rub||"");if(rub===null)return;
          const date=prompt("Date d'entrée (AAAA-MM-JJ) :",r.date_entree||"");if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert("Format de date invalide.");return;}
          const colis=prompt("Nombre de colis :",r.colis??0);if(colis===null)return;if(!Number.isFinite(Number(colis))||Number(colis)<0){alert("Nombre de colis invalide.");return;}
          const poids=prompt("Poids brut (kg) :",r.poids_brut??0);if(poids===null)return;if(!Number.isFinite(Number(poids))||Number(poids)<0){alert("Poids invalide.");return;}
          if(!confirm("Enregistrer les modifications ?"))return;edit.disabled=true;
          const {error}=await sb.from("stock_records").update({esc:esc.trim(),rub:rub.trim()||null,date_entree:date||null,colis:Number(colis),poids_brut:Number(poids)}).eq("esc",r.esc).eq("client_id",r.client_id);
          if(error){alert("Erreur Supabase : "+error.message);edit.disabled=false;return;}await reloadData();
        });actionTd.appendChild(edit);
        const del=document.createElement("button");del.className="btn-red";del.textContent="🗑 Effacer";del.addEventListener("click",async()=>{if(!confirm(`Effacer définitivement l'escale ${r.esc} ?`))return;del.disabled=true;const {error}=await sb.from("stock_records").delete().eq("esc",r.esc).eq("client_id",r.client_id);if(error){alert("Suppression refusée : "+error.message);del.disabled=false;return;}await reloadData();});actionTd.appendChild(del);
      } else if (!staff) {
        const req=document.createElement("button");req.className="btn-amber";req.textContent="Demander la sortie";req.addEventListener("click",async()=>{if(!confirm(`Envoyer à IPSEN une demande de sortie pour l'escale ${r.esc} ?`))return;req.disabled=true;const {error}=await sb.from("exit_requests").insert({stock_record_id:r.id,client_id:r.client_id,stock_esc:r.esc,requested_by:user.id,status:"pending"});if(error){alert("La demande n'a pas pu être envoyée. Vérifiez la connexion et les autorisations Supabase (RLS). Détail : " + error.message);req.disabled=false;return;}req.textContent="Demande envoyée";});actionTd.appendChild(req);
      } else {
        actionTd.textContent="Consultation seule";
      }
      tr.appendChild(actionTd);rows.appendChild(tr);
    });count.textContent=`${filtered.length} escale(s) affichée(s)`;
  }
  [search,statusFilter,clientFilter,dateFilter,sortFilter].filter(Boolean).forEach(el=>el.addEventListener(el===search?"input":"change",render));render();
}

function makePanel(title, admin) {
  const panel=document.createElement("section");panel.className="card";panel.style.marginTop="20px";
  panel.innerHTML=`<div class="toolbar"><div><h1>${title}</h1><p>Tableau de bord logistique IPSEN</p></div><div class="toolbar-actions">${admin?'<button id="newEscaleBtn" type="button">＋ Nouvelle escale</button><button id="importExcelBtn" type="button" class="btn-green">📥 Importer depuis Excel</button>':''}<button id="logout" class="btn-light" type="button">Se déconnecter</button></div></div>
  ${admin?`<nav id="adminSectionsNav" style="display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 22px"><button type="button" id="showStockSection" class="btn-green" aria-pressed="true">📦 Gestion de stock</button><button type="button" id="showContainersSection" class="btn-light" aria-pressed="false">🚛 Gestion des conteneurs</button></nav>`:''}
  <div id="stockManagementView">
  <div id="stats" class="stats-grid"><div class="stat">Chargement des indicateurs…</div></div>
  ${admin?`<section id="importExcelPanel" class="hide" style="background:#f0fdf4;border:1px solid #bbf7d0;padding:18px;border-radius:14px;margin:18px 0"><h3>📥 Importer les escales depuis Excel</h3><p>Colonnes reconnues : Client, ESC, RUB, Date d'entrée, Nombre de colis, Poids brut (kg). Le nom du client dans Excel est facultatif si vous choisissez un client par défaut ci-dessous.</p><label for="importDefaultClient">Client par défaut (si le fichier ne contient pas le client)</label><select id="importDefaultClient"><option value="">Choisir un client par défaut</option></select><label for="importExcelFile">Fichier Excel (.xlsx, .xls) ou CSV</label><input id="importExcelFile" type="file" accept=".xlsx,.xls,.csv" /><div class="form-actions"><button id="previewExcelBtn" type="button">Vérifier le fichier</button><button id="runExcelImportBtn" type="button" class="btn-green" disabled>Importer les escales valides</button><button id="cancelExcelImportBtn" type="button" class="btn-light">Fermer</button></div><p id="importExcelMsg" role="status"></p><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Ligne Excel</th><th>Client</th><th>ESC</th><th>RUB</th><th>Date entrée</th><th>Colis</th><th>Poids brut</th><th>Résultat</th></tr></thead><tbody id="importExcelRows"><tr><td colspan="8">Choisissez un fichier puis cliquez sur « Vérifier le fichier ».</td></tr></tbody></table></div></section>`:''}
  ${admin?`<section id="newEscaleForm" class="hide" style="background:#f8fbff;border:1px solid #dbeafe;padding:18px;border-radius:14px;margin:18px 0"><h3>＋ Créer une nouvelle escale</h3><form id="escaleForm"><div class="form-grid"><div><label for="eClient">Client *</label><select id="eClient" required><option value="">Choisir un client</option></select></div><div><label for="eEsc">Numéro d'escale (ESC) *</label><input id="eEsc" required placeholder="Ex. ESC-2026-001"></div><div><label for="eRub">Référence (RUB)</label><input id="eRub" placeholder="Référence / désignation"></div><div><label for="eDate">Date d'entrée *</label><input id="eDate" type="date" required></div><div><label for="eColis">Nombre de colis</label><input id="eColis" type="number" min="0" step="1" value="0"></div><div><label for="ePoids">Poids brut (kg)</label><input id="ePoids" type="number" min="0" step="0.01" value="0"></div></div><div class="form-actions"><button type="submit" class="btn-green" id="saveEscale">Enregistrer l'escale</button><button type="button" class="btn-light" id="cancelEscale">Annuler</button></div><p id="eMsg" role="status"></p></form></section>`:''}
  <div class="toolbar"><h3 style="margin:0">Suivi des escales</h3></div><div class="filters"><input id="search" placeholder="Rechercher ESC, RUB, client…" aria-label="Recherche"><select id="statusFilter"><option value="">Tous les statuts</option><option value="livree">Livrée</option><option value="nonlivree">Non livrée</option></select>${admin?'<select id="clientFilter"><option value="">Tous les clients</option></select>':''}<input id="dateFilter" type="date" aria-label="Filtrer par date d'entrée"><select id="sortFilter"><option value="desc">Date décroissante</option><option value="asc">Date croissante</option></select></div>
  <div class="table-wrap"><table><thead><tr>${admin?'<th>Client</th>':''}<th>ESC</th><th>RUB</th><th>Date entrée</th><th>Colis</th><th>Poids brut (kg)</th><th>Statut</th><th>Date livraison</th><th>Action</th></tr></thead><tbody id="stockRows"></tbody></table></div><p id="count"></p></div>`;
  main.appendChild(panel);addLogout(panel);return panel;
}

async function loadPortal(user, profile) {
  form.style.display = "none";
  document.querySelector("main > .card").querySelector("h3").style.display = "none";
  message.textContent = "";
  const isAdmin = profile.role === "admin";
  const isStaff = profile.role === "staff";
  if (!isAdmin && !isStaff && !profile.client_id) {
    message.textContent = "Votre compte n'est pas associé à un client. Contactez IPSEN Logistics.";
    form.style.display = "block"; await sb.auth.signOut(); return;
  }
  const panel = makePanel(isAdmin ? "Dashboard Admin" : (isStaff ? "Espace interne — consultation" : "Espace Client"), isAdmin);
  const stats = panel.querySelector("#stats");
  let clients = [], records = [];
  if (isAdmin || isStaff) {
    const [cr, sr] = await Promise.all([
      sb.from("clients").select("id,name").order("name"),
      sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie").order("date_entree", {ascending:false})
    ]);
    if (cr.error || sr.error) { stats.textContent = "Erreur de chargement des données. Vérifiez les politiques RLS et les colonnes."; return; }
    clients = cr.data || []; records = sr.data || [];
  } else {
    const [cr, sr] = await Promise.all([
      sb.from("clients").select("id,name").eq("id", profile.client_id).single(),
      sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie").eq("client_id", profile.client_id).order("date_entree", {ascending:false})
    ]);
    if (cr.error || sr.error) { stats.textContent = "Impossible de charger votre stock. Vérifiez les droits RLS et votre association client."; return; }
    clients = cr.data ? [cr.data] : []; records = sr.data || [];
    const name = clients[0]?.name || "Espace Client";
    panel.querySelector("h1").textContent = name;
    panel.querySelector("p").textContent = `Bienvenue ${name} — consultation de votre stock uniquement.`;
  }
  if (isStaff) {
    panel.querySelector("p").textContent = "Accès interne IPSEN — consultation et suivi uniquement, sans modification du stock.";
  }
  const clientNames = Object.fromEntries(clients.map(c => [c.id, c.name]));
  // Remplir la liste du formulaire « Nouvelle escale » avec les clients chargés depuis Supabase.
  const escaleClientSelect = panel.querySelector("#eClient");
  if (isAdmin && escaleClientSelect) {
    clients.forEach(c => {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.name;
      escaleClientSelect.appendChild(option);
    });
    if (clients.length === 0) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Aucun client disponible";
      option.disabled = true;
      escaleClientSelect.appendChild(option);
    }
  }
  const importDefaultClient=panel.querySelector("#importDefaultClient");
  if(importDefaultClient) clients.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;importDefaultClient.appendChild(o);});
  const clientFilter=panel.querySelector("#clientFilter");
  if(clientFilter) clients.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;clientFilter.appendChild(o);});
  const totalColis = records.reduce((sum,r) => sum + (Number(r.colis)||0), 0);
  const totalWeight = records.reduce((sum,r) => sum + (Number(r.poids_brut)||0), 0);
  stats.innerHTML = `<div class="stat"><div class="stat-label">${isAdmin ? 'Clients' : 'Votre client'}</div><div class="stat-value" style="font-size:${isAdmin?'26px':'18px'}">${isAdmin ? clients.length : (clients[0]?.name || '')}</div></div><div class="stat"><div class="stat-label">Opérations</div><div class="stat-value">${records.length}</div></div><div class="stat"><div class="stat-label">Total colis</div><div class="stat-value">${totalColis.toLocaleString('fr-FR')}</div></div><div class="stat"><div class="stat-label">Poids brut</div><div class="stat-value">${totalWeight.toLocaleString('fr-FR')} kg</div></div>`;
  const redraw=async()=>{const res=(isAdmin||isStaff)?await sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie").order("date_entree",{ascending:false}):await sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie").eq("client_id",profile.client_id).order("date_entree",{ascending:false});if(res.error){alert("Impossible de recharger les escales : "+res.error.message);return;}records=res.data||[];const sumColis=records.reduce((a,r)=>a+(Number(r.colis)||0),0),sumWeight=records.reduce((a,r)=>a+(Number(r.poids_brut)||0),0),done=records.filter(r=>/livr/i.test(r.statut||"")).length;stats.innerHTML=`<div class="stat"><div class="stat-label">Total escales</div><div class="stat-value">${records.length}</div></div><div class="stat"><div class="stat-label">En cours</div><div class="stat-value">${records.length-done}</div></div><div class="stat"><div class="stat-label">Livrées</div><div class="stat-value">${done}</div></div><div class="stat"><div class="stat-label">Total colis</div><div class="stat-value">${sumColis.toLocaleString("fr-FR")}</div></div><div class="stat"><div class="stat-label">Poids brut</div><div class="stat-value">${sumWeight.toLocaleString("fr-FR")} kg</div></div>${isAdmin?`<div class="stat"><div class="stat-label">Clients</div><div class="stat-value">${clients.length}</div></div>`:""}` ;showTable(panel,records,clientNames,isAdmin,redraw,user,isStaff);};
  if(isAdmin){
    const open=panel.querySelector("#newEscaleForm");
    panel.querySelector("#newEscaleBtn").addEventListener("click",()=>{open.classList.toggle("hide");panel.querySelector("#importExcelPanel").classList.add("hide");});
    panel.querySelector("#cancelEscale").addEventListener("click",()=>{panel.querySelector("#escaleForm").reset();open.classList.add("hide");});
    panel.querySelector("#escaleForm").addEventListener("submit",async e=>{e.preventDefault();const msg=panel.querySelector("#eMsg"),btn=panel.querySelector("#saveEscale"),client_id=panel.querySelector("#eClient").value,esc=panel.querySelector("#eEsc").value.trim();if(!client_id||!esc){msg.textContent="Client et ESC obligatoires.";return;}btn.disabled=true;const {error}=await sb.from("stock_records").insert({client_id,esc,rub:panel.querySelector("#eRub").value.trim()||null,date_entree:panel.querySelector("#eDate").value,colis:Number(panel.querySelector("#eColis").value)||0,poids_brut:Number(panel.querySelector("#ePoids").value)||0,statut:"En cours",date_sortie:null});if(error){msg.textContent="Erreur Supabase : "+error.message;btn.disabled=false;return;}msg.textContent="Escale créée.";panel.querySelector("#escaleForm").reset();open.classList.add("hide");btn.disabled=false;await redraw();});

    const importPanel=panel.querySelector("#importExcelPanel"), importBtn=panel.querySelector("#importExcelBtn"), fileInput=panel.querySelector("#importExcelFile"), previewBtn=panel.querySelector("#previewExcelBtn"), runBtn=panel.querySelector("#runExcelImportBtn"), importMsg=panel.querySelector("#importExcelMsg"), importRows=panel.querySelector("#importExcelRows");
    let preparedRows=[];
    importBtn.addEventListener("click",()=>{importPanel.classList.toggle("hide");open.classList.add("hide");});
    panel.querySelector("#cancelExcelImportBtn").addEventListener("click",()=>importPanel.classList.add("hide"));
    fileInput.addEventListener("change",()=>{preparedRows=[];runBtn.disabled=true;importRows.replaceChildren();importMsg.textContent="Fichier sélectionné. Cliquez sur « Vérifier le fichier ».";});
    const normalizeHeader=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const aliases={client:["client","nomclient","clientname","societe","societecliente"],esc:["esc","escale","numeroescale","numescale","numeroesc","n°esc","n°escale"],rub:["rub","reference","referencerub","designation","ref"],date:["dateentree","dateentrée","dateentreeescale","dateentréeescale","date"],colis:["colis","nombredecolis","nbcolis","quantitecolis","quantite"],poids:["poidsbrutkg","poidsbrut","poids","weight"]};
    function findValue(row,keys){const keyMap=new Map(Object.keys(row).map(k=>[normalizeHeader(k),k]));for(const candidate of keys){const found=keyMap.get(normalizeHeader(candidate));if(found!==undefined)return row[found];}return "";}
    function parseImportDate(v){
      if(v instanceof Date && !isNaN(v))return v.toISOString().slice(0,10);
      if(typeof v==="number" && window.XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;}
      const s=String(v??"").trim();if(!s)return "";
      let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
      m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
      return "";
    }
    function renderImportPreview(){
      importRows.replaceChildren();
      preparedRows.forEach(r=>{const tr=document.createElement("tr");[r.line,r.clientName||"—",r.esc||"—",r.rub||"—",r.date_entree||"—",r.colis,r.poids_brut,r.message].forEach((v,i)=>{const td=document.createElement("td");td.textContent=String(v??"");if(i===7)td.style.color=r.valid?"#166534":"#b91c1c";tr.appendChild(td);});importRows.appendChild(tr);});
    }
    previewBtn.addEventListener("click",async()=>{
      preparedRows=[];runBtn.disabled=true;importMsg.textContent="";
      const file=fileInput.files?.[0];if(!file){importMsg.textContent="Choisissez un fichier Excel ou CSV.";return;}
      if(file.size>10*1024*1024){importMsg.textContent="Le fichier dépasse 10 Mo. Divisez-le en fichiers plus petits.";return;}
      if(!window.XLSX){importMsg.textContent="Le module Excel n'a pas pu charger. Vérifiez la connexion internet puis actualisez la page.";return;}
      try{
        const workbook=XLSX.read(await file.arrayBuffer(),{cellDates:true});const sheet=workbook.Sheets[workbook.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(sheet,{defval:"",raw:true});
        if(!raw.length){importMsg.textContent="Aucune ligne trouvée dans la première feuille.";return;}
        const existing=new Set(records.map(r=>`${r.client_id}::${String(r.esc||"").trim().toLowerCase()}`));const seen=new Set();
        preparedRows=raw.map((row,index)=>{
          const rawClient=findValue(row,aliases.client);const clientName=String(rawClient??"").trim();let client=clientName?clients.find(c=>normalizeHeader(c.name)===normalizeHeader(clientName)):null;
          if(!client&&!clientName){const defaultId=importDefaultClient.value;client=clients.find(c=>c.id===defaultId)||null;}
          const esc=String(findValue(row,aliases.esc)??"").trim();const rub=String(findValue(row,aliases.rub)??"").trim();const date_entree=parseImportDate(findValue(row,aliases.date));
          const parseNum=v=>{if(typeof v==="number")return v;const n=Number(String(v??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0;};
          const colis=parseNum(findValue(row,aliases.colis)),poids_brut=parseNum(findValue(row,aliases.poids));
          let message="Prêt à importer",valid=true;const key=client&&esc?`${client.id}::${esc.toLowerCase()}`:"";
          if(!client){valid=false;message=clientName?`Client introuvable : ${clientName}`:"Choisissez un client par défaut";}
          else if(!esc){valid=false;message="ESC manquant";}
          else if(!date_entree){valid=false;message="Date d'entrée invalide/manquante";}
          else if(colis<0||poids_brut<0){valid=false;message="Colis/poids négatif";}
          else if(existing.has(key)||seen.has(key)){valid=false;message="Doublon ESC/client — ignoré";}
          if(key)seen.add(key);
          return {line:index+2,client_id:client?.id||null,clientName:client?.name||clientName,esc,rub,date_entree,colis,poids_brut,valid,message};
        }).filter(r=>r.esc||r.clientName||r.date_entree);
        renderImportPreview();const validCount=preparedRows.filter(r=>r.valid).length;importMsg.textContent=`${preparedRows.length} ligne(s) analysée(s), ${validCount} prête(s), ${preparedRows.length-validCount} à corriger/ignorées.`;runBtn.disabled=validCount===0;
      }catch(err){importMsg.textContent="Lecture du fichier impossible : "+(err.message||"vérifiez le format Excel.");}
    });
    runBtn.addEventListener("click",async()=>{
      const validRows=preparedRows.filter(r=>r.valid);if(!validRows.length)return;
      if(!confirm(`Importer ${validRows.length} escale(s) dans Supabase ? Les doublons et lignes invalides seront ignorés.`))return;
      runBtn.disabled=true;previewBtn.disabled=true;let added=0,failed=0;const failedRows=[];
      for(const r of validRows){
        const {error}=await sb.from("stock_records").insert({client_id:r.client_id,esc:r.esc,rub:r.rub||null,date_entree:r.date_entree,colis:r.colis,poids_brut:r.poids_brut,statut:"En cours",date_sortie:null});
        if(error){failed++;r.valid=false;r.message="Erreur Supabase : "+error.message;failedRows.push(r.line);}else{added++;r.message="Importée ✓";r.valid=true;}
      }
      renderImportPreview();importMsg.textContent=`Import terminé : ${added} ajoutée(s), ${failed} erreur(s).${failedRows.length?" Lignes en erreur : "+failedRows.join(", "):""}`;previewBtn.disabled=false;await redraw();
    });
  }
  await redraw();
  if (isAdmin) {
    await addContainerModule(panel, clients, false);
    await addExitRequestsModule(panel, clientNames);
    const stockView=panel.querySelector("#stockManagementView");
    const requestsSection=panel.querySelector("#refreshRequests")?.closest("section");
    if(stockView && requestsSection) stockView.appendChild(requestsSection);
    const stockBtn=panel.querySelector("#showStockSection"), containersBtn=panel.querySelector("#showContainersSection");
    const containersView=panel.querySelector("#containerManagementView");
    const showSection=(which)=>{
      const showStock=which==="stock";
      stockView?.classList.toggle("hide",!showStock);
      containersView?.classList.toggle("hide",showStock);
      stockBtn.className=showStock?"btn-green":"btn-light";
      containersBtn.className=showStock?"btn-light":"btn-green";
      stockBtn.setAttribute("aria-pressed",String(showStock));
      containersBtn.setAttribute("aria-pressed",String(!showStock));
      if(showStock){panel.querySelector("#importExcelPanel")?.classList.add("hide");panel.querySelector("#newEscaleForm")?.classList.add("hide");}
    };
    stockBtn.addEventListener("click",()=>showSection("stock"));
    containersBtn.addEventListener("click",()=>showSection("containers"));
    showSection("stock");
  } else if (isStaff) {
    await addContainerModule(panel, clients, true);
  }
}

async function addExitRequestsModule(parent, clientNames) {
  const section=document.createElement("section");
  section.className="card";
  section.style.marginTop="20px";
  section.innerHTML=`<div class="toolbar"><div><h1>🔔 Demandes de sortie des clients</h1><p>Demandes envoyées depuis l’espace client.</p></div><button type="button" id="refreshRequests" class="btn-light">Actualiser</button></div>
    <div class="table-wrap"><table><thead><tr><th>Client</th><th>ESC</th><th>Demandée le</th><th>Statut</th><th>Action</th></tr></thead><tbody id="requestRows"><tr><td colspan="5">Chargement…</td></tr></tbody></table></div><p id="requestMsg" role="status"></p>`;
  parent.appendChild(section);
  const rows=section.querySelector("#requestRows"), msg=section.querySelector("#requestMsg");
  async function refreshRequests(){
    rows.replaceChildren();
    const {data,error}=await sb.from("exit_requests").select("id,client_id,stock_esc,status,created_at").order("created_at",{ascending:false}).limit(200);
    if(error){rows.innerHTML='<tr><td colspan="5">Impossible de charger les demandes. Vérifiez que la table exit_requests existe et que les politiques RLS autorisent l’administrateur à lire les demandes.</td></tr>';msg.textContent="";return;}
    if(!data?.length){rows.innerHTML='<tr><td colspan="5">Aucune demande de sortie pour le moment.</td></tr>';msg.textContent="";return;}
    data.forEach(item=>{
      const tr=document.createElement("tr");
      const date=item.created_at?new Date(item.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short",timeZone:"Africa/Tunis"}):"—";
      const statusLabels={pending:"En attente",approved:"Acceptée",rejected:"Refusée"};
      [clientNames[item.client_id]||"Client",item.stock_esc||"—",date,statusLabels[item.status]||item.status||"Nouvelle"].forEach(v=>tr.appendChild(cell(v)));
      const actionTd=document.createElement("td");
      if(item.status==="pending"){
        const approve=document.createElement("button");
        approve.type="button"; approve.className="btn-green"; approve.textContent="✓ Accepter";
        approve.addEventListener("click",()=>updateRequest(item,"approved",approve));
        const reject=document.createElement("button");
        reject.type="button"; reject.className="btn-red"; reject.textContent="✕ Refuser";
        reject.addEventListener("click",()=>updateRequest(item,"rejected",reject));
        actionTd.append(approve,reject);
      } else {
        actionTd.textContent="—";
      }
      tr.appendChild(actionTd);
      rows.appendChild(tr);
    });
    msg.textContent=`${data.length} demande(s) affichée(s).`;
  }
  async function updateRequest(item,newStatus,button){
    const actionText=newStatus==="approved"?"accepter":"refuser";
    if(!confirm(`Confirmer : ${actionText} la demande pour l'escale ${item.stock_esc||"—"} ?`))return;
    button.disabled=true;
    const {error}=await sb.from("exit_requests").update({status:newStatus}).eq("id",item.id);
    if(error){
      alert("La demande n'a pas été mise à jour. Vérifiez la politique RLS UPDATE pour les administrateurs. Détail : "+error.message);
      button.disabled=false;
      return;
    }
    msg.textContent=newStatus==="approved"?"Demande acceptée.":"Demande refusée.";
    await refreshRequests();
  }
  section.querySelector("#refreshRequests").addEventListener("click",refreshRequests);
  await refreshRequests();
}

function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString("fr-FR", {dateStyle:"short", timeStyle:"short", timeZone:"Africa/Tunis"});
}
function duration(entry, exit) {
  if (!entry) return "—";
  // Parse timestamps safely and avoid displaying negative durations.
  const start = Date.parse(entry);
  const end = exit ? Date.parse(exit) : Date.now();
  if (!Number.isFinite(start) || !Number.isFinite(end)) return "—";
  const totalMinutes = Math.max(0, Math.floor((end - start) / 60000));
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return `${days} j ${hours} h ${minutes} min`;
  if (hours > 0) return `${hours} h ${minutes} min`;
  return `${minutes} min`;
}
async function addContainerModule(parent, clients, readOnly=false) {
  const section = document.createElement("section");
  section.className = "card"; section.style.marginTop = "20px";
  section.id = "containerManagementView";
  if (!readOnly) section.classList.add("hide");
  section.innerHTML = `
    <h1>🚛 Gestion des conteneurs</h1>
    <p>Mode rapide : saisissez le numéro, puis confirmez directement l’entrée ou la sortie. Aucun client requis.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0">
      <div style="background:#edf7f3;padding:14px;border-radius:10px"><small>Dans le parc</small><h2 id="cInside">—</h2></div>
      <div style="background:#eef4fb;padding:14px;border-radius:10px"><small>Entrées aujourd'hui</small><h2 id="cTodayIn">—</h2></div>
      <div style="background:#fff5e8;padding:14px;border-radius:10px"><small>Sorties aujourd'hui</small><h2 id="cTodayOut">—</h2></div>
    </div>
    ${readOnly ? '<p>Mode consultation seule : les entrées, sorties et suppressions sont désactivées.</p>' : `<h3>Nouvelle opération rapide</h3>
    <label for="cNumber">Numéro du conteneur</label>
    <input id="cNumber" placeholder="Ex. MSKU1234567" autocomplete="off" autocapitalize="characters" autofocus>
    <label for="cType">Type de conteneur</label>
    <select id="cType" required><option value="40">40 pieds</option><option value="20">20 pieds</option><option value="45">45 pieds</option></select>
    <label for="cDamage">Dégâts à l’arrivée ?</label>
    <select id="cDamage" required><option value="Non">Non</option><option value="Oui">Oui</option></select>
    <label for="cTruck">Matricule camion / transporteur</label>
    <input id="cTruck" placeholder="Ex. 123 تونس 4567" autocomplete="off" required>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0"><button id="cEntry" type="button">Confirmer l'entrée</button><button id="cExit" type="button" style="background:#b45309">Confirmer la sortie</button></div>`}
    <p id="cMsg" role="status"></p><hr style="border:0;border-top:1px solid #e2e8f0;margin:22px 0">
    <h3>Historique des mouvements</h3><input id="cSearch" placeholder="Rechercher un numéro">
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>N° conteneur</th><th>Type</th><th>Dégâts à l’entrée</th><th>Dégâts à la sortie</th><th>Matricule camion / transporteur</th><th>Entrée</th><th>Sortie</th><th>Durée</th><th>Statut</th><th>Action</th></tr></thead><tbody id="cRows"></tbody></table></div>
    <p id="cCount"></p>`;
  parent.appendChild(section);
  const el = id => section.querySelector("#"+id);
  let movements = [];
  async function refresh() {
    const {data,error}=await sb.from("container_movements").select("id,container_number,container_type,has_damage,exit_has_damage,truck_registration,entry_at,exit_at,notes,status").order("entry_at",{ascending:false}).limit(500);
    if(error){el("cMsg").textContent="Tableau conteneurs indisponible. Exécutez le script SQL fourni et vérifiez les droits RLS."; return;}
    movements=data||[];
    const today=new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
    el("cInside").textContent=movements.filter(x=>!x.exit_at).length;
    el("cTodayIn").textContent=movements.filter(x=>x.entry_at&&new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date(x.entry_at))===today).length;
    el("cTodayOut").textContent=movements.filter(x=>x.exit_at&&new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date(x.exit_at))===today).length;
    renderRows();
  }
  function renderRows(){
    const q=el("cSearch").value.trim().toLowerCase(), tbody=el("cRows"); tbody.replaceChildren();
    const filtered=movements.filter(x=>[x.container_number,x.status||"",x.notes||""].some(v=>String(v).toLowerCase().includes(q)));
    filtered.forEach(x=>{
      const tr=document.createElement("tr");
      const vals=[x.container_number,x.container_type?`${x.container_type} pieds`:"—",x.has_damage??"—",x.exit_has_damage??(x.exit_at?"Non renseigné":"—"),x.truck_registration||"—",formatDate(x.entry_at),formatDate(x.exit_at),duration(x.entry_at,x.exit_at),x.exit_at?"Sorti":"Dans le parc"];
      vals.forEach(v=>tr.appendChild(cell(v)));
      const actionCell=document.createElement("td");
      if (readOnly) {
        actionCell.textContent="Consultation seule";
      } else {
        const del=document.createElement("button");
        del.type="button"; del.textContent="Effacer";
        del.style.cssText="background:#b91c1c;color:#fff;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap";
        del.addEventListener("click",()=>deleteMovement(x,del));
        actionCell.appendChild(del);
      }
      tr.appendChild(actionCell); tbody.appendChild(tr);
    });
    el("cCount").textContent=`${filtered.length} mouvement(s) affiché(s)`;
  }
  async function deleteMovement(movement, button){
    const label=`${movement.container_number} — entrée ${formatDate(movement.entry_at)}`;
    if(!window.confirm(`Supprimer définitivement ce mouvement ?\n${label}\nCette action est irréversible.`)) return;
    button.disabled=true; button.textContent="Suppression…";
    el("cMsg").textContent="Suppression du mouvement…";
    try{
      const {error}=await sb.from("container_movements").delete().eq("id",movement.id);
      if(error) throw error;
      el("cMsg").textContent=`Mouvement ${movement.container_number} supprimé.`;
      await refresh();
    }catch(err){
      el("cMsg").textContent="Suppression refusée : "+(err.message||"vérifiez les autorisations DELETE (RLS) dans Supabase.");
      button.disabled=false; button.textContent="Effacer";
    }
  }
  el("cSearch").addEventListener("input",renderRows);
  // Saisie manuelle prioritaire : pas de chargement ni d'attente OCR.
  if (!readOnly) {
    el("cNumber").addEventListener("input", () => {
      el("cNumber").value = el("cNumber").value.toUpperCase().replace(/\s+/g, "");
    });
    el("cNumber").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveMovement("entry");
      }
    });
  }
  async function saveMovement(action){
    const number=el("cNumber").value.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z]{4}[A-Z0-9]{7}$/.test(number)){el("cMsg").textContent="Vérifiez le numéro : format habituel 4 lettres + 7 caractères.";return;}
    if(action==="entry" && (!el("cType").value || !el("cDamage").value || !el("cTruck").value.trim())){el("cMsg").textContent="Renseignez le type, les dégâts et le matricule camion.";return;}
    el("cEntry").disabled=el("cExit").disabled=true;el("cMsg").textContent="Enregistrement…";
    try{
      const active=movements.find(x=>x.container_number===number&&!x.exit_at);
      if(action==="entry"){
        if(active){el("cMsg").textContent="Ce conteneur est déjà enregistré dans le parc. Utilisez la sortie si nécessaire.";return;}
        const {error}=await sb.from("container_movements").insert({container_number:number,container_type:el("cType").value,has_damage:el("cDamage").value,truck_registration:el("cTruck").value.trim(),client_id:null,created_by:(await sb.auth.getUser()).data.user?.id});
        if(error)throw error;
        el("cMsg").textContent=`Entrée enregistrée pour ${number}. Date et heure générées automatiquement.`;
      }else{
        if(!active){el("cMsg").textContent="Aucune entrée ouverte trouvée pour ce numéro. Vérifiez le numéro ou enregistrez l'entrée.";return;}
        const exitDamage=window.prompt("Dégâts constatés à la sortie ? Tapez Oui ou Non :","Non");
        if(exitDamage===null)return;
        const normalizedExitDamage=exitDamage.trim().toLowerCase();
        if(!["oui","non"].includes(normalizedExitDamage)){el("cMsg").textContent="Réponse invalide : indiquez Oui ou Non pour les dégâts à la sortie.";return;}
        const exitAt=new Date().toISOString();
        const {error}=await sb.from("container_movements").update({exit_at:exitAt,exit_has_damage:normalizedExitDamage==="oui"?"Oui":"Non",status:"sorti"}).eq("id",active.id).is("exit_at",null);
        if(error)throw error;
        el("cMsg").textContent=`Sortie enregistrée pour ${number}. Dégâts à la sortie : ${normalizedExitDamage==="oui"?"Oui":"Non"}. Durée dans le parc : ${duration(active.entry_at,exitAt)}.`;
      }
      el("cNumber").value="";if(action==="entry"){el("cTruck").value="";el("cDamage").value="Non";el("cType").value="40";}el("cNumber").focus();await refresh();
    }catch(err){el("cMsg").textContent="Erreur d'enregistrement : "+(err.message||"vérifiez la table et les autorisations Supabase.");}
    finally{el("cEntry").disabled=el("cExit").disabled=false;}
  }
  if (!readOnly) {
    el("cEntry").addEventListener("click",()=>saveMovement("entry"));
    el("cExit").addEventListener("click",()=>saveMovement("exit"));
  }
  await refresh();
}
form.addEventListener("submit", async (e) => {
  e.preventDefault(); message.textContent = "Connexion...";
  const {data, error} = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) { message.textContent = "Erreur de connexion : vérifiez l'e-mail et le mot de passe."; return; }
  const {data: profile, error: pError} = await sb.from("profiles").select("role,client_id").eq("id", data.user.id).single();
  if (pError || !profile) { message.textContent = "Profil introuvable. Contactez l'administrateur IPSEN."; await sb.auth.signOut(); return; }
  await loadPortal(data.user, profile);
});
// Reprendre la session si l'utilisateur actualise la page.
(async () => {
  const {data: {session}} = await sb.auth.getSession();
