  td.style.cssText = "padding:9px;border-bottom:1px solid #e2e8f0;white-space:nowrap";
  if (value && typeof value === "object" && value.badge === true) {
    const badge = document.createElement("span");
    badge.className = value.done ? "badge badge-done" : "badge";
    badge.textContent = value.text || "En cours";
    td.appendChild(badge);
  } else if (value && typeof value === "object" && value.days === true) {
    const badge = document.createElement("span");
    badge.className = "days-badge";
    badge.textContent = value.text;
    badge.style.background = value.color;
    badge.style.color = value.textColor;
    td.appendChild(badge);
  } else {
    td.textContent = value == null ? "" : String(value);
  }
  return td;
}
function printDeliverySlip(record, clientName) {

    if(!value) return "—";

function showTable(panel, records, clientNames, admin, reloadData, user, staff=false) {
  const rows=panel.querySelector("#stockRows"), search=panel.querySelector("#search"), statusFilter=panel.querySelector("#statusFilter"), count=panel.querySelector("#count");
  const clientFilter=panel.querySelector("#clientFilter"), dateFilter=panel.querySelector("#dateFilter"), sortFilter=panel.querySelector("#sortFilter"), inventoryFilter=panel.querySelector("#inventoryFilter");
  function render(){
    const q=search.value.trim().toLowerCase(), wanted=statusFilter.value, clientWanted=clientFilter?.value||"", dateWanted=dateFilter?.value||"", inventoryWanted=inventoryFilter?.value||"";
    const quickFilter=panel.dataset.stockQuickFilter||"";
    const today=todayTunisKey();
    let filtered=records.filter(r=>[clientNames[r.client_id]||"",r.esc||"",r.rub||"",r.statut||"",r.date_entree||"",r.date_sortie||"",r.emplacement||""].some(v=>String(v).toLowerCase().includes(q))
      &&(!wanted||(wanted==="livree"?/livr/i.test(r.statut||""):! /livr/i.test(r.statut||"")))
      &&(!clientWanted||r.client_id===clientWanted)&&(!dateWanted||r.date_entree===dateWanted)
      &&(!inventoryWanted||(inventoryWanted==="done"?!!r.date_inventaire:!r.date_inventaire))
      &&(!quickFilter||(quickFilter==="inside"?(!/livr/i.test(r.statut||"")&&!r.date_sortie):quickFilter==="todayIn"?r.date_entree===today:quickFilter==="todayOut"?r.date_sortie===today:false)));
    const sortMode=sortFilter?.value||"desc";
    filtered.sort((a,b)=>{
      if(sortMode==="colisAsc") return (Number(a.colis)||0)-(Number(b.colis)||0);
      if(sortMode==="colisDesc") return (Number(b.colis)||0)-(Number(a.colis)||0);
      return String(a.date_entree||"").localeCompare(String(b.date_entree||""))*(sortMode==="asc"?1:-1);
    });
    panel._filteredStockRecords=filtered.slice();
    rows.replaceChildren();
    filtered.forEach(r=>{const tr=document.createElement("tr");
      tr.addEventListener("click",e=>{if(e.target.closest("button,a,input,select"))return;rows.querySelectorAll("tr.selected-escale").forEach(x=>x.classList.remove("selected-escale"));tr.classList.add("selected-escale");});
      const isDelivered=/livr/i.test(r.statut||"")||!!r.date_sortie;
      const days= isDelivered ? null : daysSinceEntry(r.date_entree);
      let daysCell="—";
      if(!isDelivered && days!==null){
        const style=days>=60?{color:"#fee2e2",textColor:"#991b1b"}:days>=50?{color:"#fef3c7",textColor:"#92400e"}:{color:"#dcfce7",textColor:"#166534"};
        daysCell={days:true,text:`${days} jour(s)`,...style};
      }
      const vals=[clientNames[r.client_id]||"Client non associé",r.esc,r.rub,r.date_entree,daysCell,r.colis,r.poids_brut,{badge:true,text:r.statut||"En cours",done:isDelivered},r.date_sortie||"—",r.num_dossier||"—",r.emplacement||"—",r.date_inventaire||"Non inventoriée"];
      const headerLabels=Array.from(rows.closest("table")?.querySelectorAll("thead th")||[]).map(th=>th.textContent.trim());
      vals.forEach((v,i)=>{const td=cell(v);if(headerLabels[i])td.dataset.label=headerLabels[i];tr.appendChild(td);});
      const actionTd=document.createElement("td");
      if(isDelivered){
        const printBtn=document.createElement("button");
        printBtn.type="button";printBtn.className="btn-light";
        printBtn.textContent="🖨 Bordereau";
        printBtn.addEventListener("click",()=>printDeliverySlip(r,clientNames[r.client_id]||"Client non associé"));
        actionTd.appendChild(printBtn);
      }
      if(admin && !isDelivered){
        if(r.num_dossier){
          const dossierLabel=document.createElement("span");
          dossierLabel.textContent=String(r.num_dossier);
          dossierLabel.style.cssText="display:inline-block;padding:6px 9px;border-radius:8px;background:#dcfce7;color:#166534;font-weight:800";
          actionTd.appendChild(dossierLabel);
        } else {
          const dossierBtn=document.createElement("button");
          dossierBtn.type="button";dossierBtn.className="btn-amber";dossierBtn.textContent="＋ Ajouter n° dossier";
          dossierBtn.addEventListener("click",async()=>{
            const dossier=prompt(`Numéro de dossier pour l'escale ${r.esc} :`,"");
            if(dossier===null)return;
            const value=dossier.trim();
            if(!value){alert("Saisissez un numéro de dossier.");return;}
            dossierBtn.disabled=true;
            const {error}=await sb.from("stock_records").update({num_dossier:value}).eq("id",r.id);
            if(error){alert("Impossible d'enregistrer le numéro de dossier : "+error.message);dossierBtn.disabled=false;return;}
            await reloadData();
          });
          actionTd.appendChild(dossierBtn);
        }
      } else if(r.num_dossier) {
        const dossierLabel=document.createElement("span");dossierLabel.textContent=String(r.num_dossier);actionTd.appendChild(dossierLabel);
      }
      if(admin && !isDelivered){
        if(r.emplacement){
          const emplacementLabel=document.createElement("span");
          emplacementLabel.textContent=String(r.emplacement);
          emplacementLabel.style.cssText="display:inline-block;padding:6px 9px;border-radius:8px;background:#e0f2fe;color:#075985;font-weight:800;margin:2px";
          actionTd.appendChild(emplacementLabel);
        }
        const emplacementBtn=document.createElement("button");
        emplacementBtn.type="button";
        emplacementBtn.className="btn-light";
        emplacementBtn.textContent=r.emplacement?"📍 Modifier emplacement":"📍 Ajouter emplacement";
        emplacementBtn.addEventListener("click",async()=>{
          const zones=["Zone 1","Zone 2","Zone 3","1W","3W","B"];
          const choice=prompt("Choisir l'emplacement :\\n1 - Zone 1\\n2 - Zone 2\\n3 - Zone 3\\n4 - 1W\\n5 - 3W\\n6 - B",String(Math.max(0,zones.indexOf(r.emplacement))+1));
          if(choice===null)return;
          const index=Number(choice)-1;
          if(!Number.isInteger(index)||index<0||index>=zones.length){alert("Choix invalide. Saisissez un numéro de 1 à 6.");return;}
          emplacementBtn.disabled=true;
          const {error}=await sb.from("stock_records").update({emplacement:zones[index]}).eq("id",r.id);
          if(error){alert("Impossible d'enregistrer l'emplacement : "+error.message);emplacementBtn.disabled=false;return;}
          await reloadData();
        });
        actionTd.appendChild(emplacementBtn);
      }
      if(admin && !isDelivered){
        const inventoryBtn=document.createElement("button");
        inventoryBtn.type="button";
        inventoryBtn.className=r.date_inventaire?"btn-light":"btn-amber";
        inventoryBtn.textContent=r.date_inventaire?("📦 Inventoriée le "+r.date_inventaire):"📦 Confirmer inventaire";
        inventoryBtn.addEventListener("click",async()=>{
          if(r.date_inventaire && !confirm(`Cette escale a déjà été inventoriée le ${r.date_inventaire}. Mettre à jour la date avec aujourd'hui ?`))return;
          if(!r.date_inventaire && !confirm(`Confirmer que l'escale ${r.esc} a été vérifiée physiquement aujourd'hui ?`))return;
          inventoryBtn.disabled=true;
          const {error}=await sb.from("stock_records").update({date_inventaire:todayTunisKey()}).eq("id",r.id);
          if(error){alert("Impossible d'enregistrer la date d'inventaire : "+error.message);inventoryBtn.disabled=false;return;}
          await reloadData();
        });
        actionTd.appendChild(inventoryBtn);
      }
      if(admin){
        const mark=document.createElement("button");mark.className="btn-green";mark.textContent=/livr/i.test(r.statut||"")?"✓ Livrée":"✓ Marquer comme livrée";mark.disabled=/livr/i.test(r.statut||"");
        mark.addEventListener("click",async()=>{if(!confirm(`Marquer l'escale ${r.esc} comme livrée ?`))return;mark.disabled=true;const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const {error}=await sb.from("stock_records").update({statut:"Livrée",date_sortie:today}).eq("esc",r.esc).eq("client_id",r.client_id);if(error){alert("Erreur Supabase : "+error.message);mark.disabled=false;return;}await reloadData();});actionTd.appendChild(mark);
        const edit=document.createElement("button");edit.className="btn-light";edit.textContent="✏️ Modifier";edit.addEventListener("click",async()=>{
          const esc=prompt("Numéro ESC :",r.esc||"");if(esc===null)return;if(!esc.trim()){alert("Le numéro ESC est obligatoire.");return;}
          const rub=prompt("Référence RUB :",r.rub||"");if(rub===null)return;
          const date=prompt("Date d'entrée (AAAA-MM-JJ) :",r.date_entree||"");if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert("Format de date invalide.");return;}
          const colis=prompt("Nombre de colis :",r.colis??0);if(colis===null)return;if(!Number.isFinite(Number(colis))||Number(colis)<0){alert("Nombre de colis invalide.");return;}
          const poids=prompt("Poids brut (kg) :",r.poids_brut??0);if(poids===null)return;if(!Number.isFinite(Number(poids))||Number(poids)<0){alert("Poids invalide.");return;}
          if(!confirm("Enregistrer les modifications ?"))return;edit.disabled=true;
          const {error}=await sb.from("stock_records").update({esc:esc.trim(),rub:rub.trim()||null,date_entree:date||null,colis:Number(colis),poids_brut:Number(poids)}).eq("esc",r.esc).eq("client_id",r.client_id);
          if(error){alert("Erreur Supabase : "+error.message);edit.disabled=false;return;}await reloadData();
        });actionTd.appendChild(edit);
        const del=document.createElement("button");del.className="btn-red";del.textContent="🗑 Effacer";del.addEventListener("click",async()=>{if(!confirm(`Effacer définitivement l'escale ${r.esc} ?`))return;del.disabled=true;const {error}=await sb.from("stock_records").delete().eq("esc",r.esc).eq("client_id",r.client_id);if(error){alert("Suppression refusée : "+error.message);del.disabled=false;return;}await reloadData();});actionTd.appendChild(del);
      } else if (!staff) {
        const req=document.createElement("button");req.className="btn-amber";req.textContent="Demander la sortie";req.addEventListener("click",async()=>{if(!confirm(`Envoyer à IPSEN une demande de sortie pour l'escale ${r.esc} ?`))return;req.disabled=true;const {error}=await sb.from("exit_requests").insert({stock_record_id:r.id,client_id:r.client_id,stock_esc:r.esc,requested_by:user.id,status:"pending"});if(error){alert("La demande n'a pas pu être envoyée. Vérifiez la connexion et les autorisations Supabase (RLS). Détail : " + error.message);req.disabled=false;return;}req.textContent="Demande envoyée";});actionTd.appendChild(req);
      } else {
        actionTd.textContent="Consultation seule";
      }
      wrapEscaleActions(actionTd);
      tr.appendChild(actionTd);rows.appendChild(tr);
    });count.textContent=`${filtered.length} escale(s) affichée(s)`;
  }
  panel._renderStockTable=render;
  [search,statusFilter,clientFilter,dateFilter,sortFilter,inventoryFilter].filter(Boolean).forEach(el=>el.addEventListener(el===search?"input":"change",render));render();
}


function wrapEscaleActions(actionCell, menuLabel = "⚙ Actions") {
  if (!actionCell || !actionCell.children.length) return;
  if (!document.getElementById("escale-actions-menu-style")) {
    const style = document.createElement("style");
    style.id = "escale-actions-menu-style";
    style.textContent = `
      .escale-actions-menu{position:relative;display:inline-block;min-width:92px;text-align:left}
      .escale-actions-menu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border:0;border-radius:12px;background:#075eaa;color:#fff;font-weight:800;font-size:12px;box-shadow:0 3px 8px #0b3b6422;white-space:nowrap}
      .escale-actions-menu>summary::-webkit-details-marker{display:none}

      .escale-actions-list{position:absolute;right:0;top:calc(100% + 6px);z-index:1000;min-width:190px;max-width:230px;padding:9px;display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid #dbe5ef;border-radius:13px;box-shadow:0 10px 28px #102a4326}
      .escale-actions-list button{width:100%;margin:0!important;min-height:36px;white-space:normal}
      .escale-actions-list span{display:block;padding:7px 9px;font-size:12px}
      @media(max-width:700px){.escale-actions-list{right:0;min-width:175px}}
    `;
    document.head.appendChild(style);
  }
  const menu = document.createElement("details");
  menu.className = "escale-actions-menu";
  const summary = document.createElement("summary");
  summary.textContent = menuLabel;
  const list = document.createElement("div");
  list.className = "escale-actions-list";
  while (actionCell.firstChild) list.appendChild(actionCell.firstChild);
  menu.append(summary, list);
  actionCell.appendChild(menu);
}

  ${admin?`<section id="accountCreationPanel" class="hide" style="background:#fffaf0;border:1px solid #fed7aa;padding:18px;border-radius:14px;margin:18px 0"><h3>👤 Créer un compte IPSEN</h3><p>Créer un accès Client ou Staff. Le mot de passe temporaire sera communiqué séparément à la personne concernée.</p><form id="accountCreationForm"><div class="form-grid"><div><label for="newAccountRole">Type de compte *</label><select id="newAccountRole" required><option value="client">Client</option><option value="staff">Staff</option></select></div><div><label for="newAccountName">Nom / Société *</label><input id="newAccountName" required placeholder="Nom du client ou du collaborateur"></div><div><label for="newAccountEmail">Adresse e-mail de connexion *</label><input id="newAccountEmail" type="email" required placeholder="exemple@ipsenlogistics.com"></div><div><label for="newAccountPassword">Mot de passe temporaire *</label><input id="newAccountPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimum 8 caractères"></div><div id="newAccountClientWrap"><label for="newAccountClient">Client extérieur associé *</label><select id="newAccountClient"><option value="">Choisir un client extérieur</option></select></div><div id="newAccountInteriorClientWrap"><label for="newAccountInteriorClient">Client intérieur associé</label><select id="newAccountInteriorClient"><option value="">Aucun client intérieur</option></select></div></div><div class="form-actions"><button type="submit" class="btn-green" id="createAccountSubmit">Créer le compte</button><button type="button" class="btn-light" id="cancelAccountCreation">Annuler</button></div><p id="accountCreationMsg" role="status" aria-live="polite"></p></form></section>`:''}
  ${admin?`<section id="passwordManagementPanel" class="hide" style="background:#f0f7ff;border:1px solid #bfdbfe;padding:18px;border-radius:14px;margin:18px 0"><h3>🔑 Gestion des comptes et mots de passe</h3><p>Choisissez un compte Client ou Staff, saisissez un nouveau mot de passe (8 caractères minimum), puis enregistrez.</p><div class="form-actions"><button id="refreshPortalAccounts" type="button" class="btn-light">↻ Actualiser les comptes</button></div><p id="passwordManagementMsg" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Nom</th><th>E-mail</th><th>Type</th><th>Client associé</th><th>Nouveau mot de passe</th><th>Action</th></tr></thead><tbody id="portalAccountsRows"><tr><td colspan="6">Cliquez sur « Actualiser les comptes ».</td></tr></tbody></table></div></section>`:''}
  ${admin?`<section id="newEscaleForm" class="hide" style="background:#f8fbff;border:1px solid #dbeafe;padding:18px;border-radius:14px;margin:18px 0"><h3>＋ Créer une nouvelle escale</h3><form id="escaleForm"><div class="form-grid"><div><label for="eClient">Client *</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="eClient" required style="flex:1;min-width:190px"><option value="">Choisir un client</option></select><button id="addClientBtn" type="button" class="btn-light" style="white-space:nowrap">＋ Ajouter un client</button></div></div><div><label for="eEsc">Numéro d'escale (ESC) *</label><input id="eEsc" required placeholder="Ex. ESC-2026-001"></div><div><label for="eRub">Référence (RUB)</label><input id="eRub" placeholder="Référence / désignation"></div><div><label for="eDate">Date d'entrée *</label><input id="eDate" type="date" required></div><div><label for="eColis">Nombre de colis</label><input id="eColis" type="number" min="0" step="1" value="0"></div><div><label for="ePoids">Poids brut (kg)</label><input id="ePoids" type="number" min="0" step="0.01" value="0"></div><div><label for="eEmplacement">Emplacement</label><select id="eEmplacement"><option value="">Choisir un emplacement</option><option>Zone 1</option><option>Zone 2</option><option>Zone 3</option><option>1W</option><option>3W</option><option>B</option></select></div></div><div class="form-actions"><button type="submit" class="btn-green" id="saveEscale">Enregistrer l'escale</button><button type="button" class="btn-light" id="cancelEscale">Annuler</button></div><p id="eMsg" role="status"></p></form></section>`:''}
  <div class="toolbar"><h3 style="margin:0">Suivi des escales</h3><div class="toolbar-actions"><button id="exportEscalesPdf" type="button" class="btn-light">📄 Exporter la liste en PDF</button></div></div><div class="filters"><input id="search" placeholder="Rechercher ESC, RUB, client…" aria-label="Recherche"><select id="statusFilter"><option value="">Tous les statuts</option><option value="livree">Livrée</option><option value="nonlivree">Non livrée</option></select>${admin?'<select id="clientFilter"><option value="">Tous les clients</option></select>':''}<input id="dateFilter" type="date" aria-label="Filtrer par date d'entrée"><select id="inventoryFilter" aria-label="Filtrer par inventaire"><option value="">Tous les inventaires</option><option value="done">Inventoriées</option><option value="todo">Non inventoriées</option></select><select id="sortFilter"><option value="desc">Date décroissante</option><option value="asc">Date croissante</option><option value="colisAsc">Nombre de colis croissant</option><option value="colisDesc">Nombre de colis décroissant</option></select></div>
  <div class="table-wrap"><table><thead><tr><th>Client</th><th>ESC</th><th>RUB</th><th>Date entrée</th><th>Jours au parc</th><th>Colis</th><th>Poids brut (kg)</th><th>Statut</th><th>Date livraison</th><th>N° dossier</th><th>Emplacement</th><th>Date inventaire</th><th>Action</th></tr></thead><tbody id="stockRows"></tbody></table></div><p id="count"></p></div>`;
  main.appendChild(panel);addLogout(panel);return panel;
}



async function loadPortal(user, profile) {
  form.style.display = "none";
  document.querySelector("main > .card").querySelector("h3").style.display = "none";
  message.textContent = "";
  const isAdmin = profile.role === "admin";
  const isStaff = profile.role === "staff";
  // Restriction spéciale à Tarek uniquement : Dalel et les autres staff gardent leurs accès habituels.
  const isTarek = (user.email || "").toLowerCase() === "t.beldi@gmail.com";
  if (!isAdmin && !isStaff && !profile.client_id) {
    message.textContent = "Votre compte n'est pas associé à un client. Contactez IPSEN Logistics.";
    form.style.display = "block"; await sb.auth.signOut(); return;
  }
  const panel = makePanel(isAdmin ? "Dashboard Admin" : (isStaff ? "Espace interne — consultation seule" : "Espace Client"), isAdmin, isStaff);

  const stats = panel.querySelector("#stats");
  let clients = [], records = [];
  if (isAdmin || isStaff) {
    const [cr, sr] = await Promise.all([
      sb.from("clients").select("id,name").order("name"),
      sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie,num_dossier,emplacement,date_inventaire").order("date_entree", {ascending:false})
    ]);
    if (cr.error || sr.error) { stats.textContent = "Erreur de chargement des données. Vérifiez les politiques RLS et les colonnes."; return; }
    clients = cr.data || []; records = sr.data || [];
  } else {
    const [cr, sr] = await Promise.all([
      sb.from("clients").select("id,name").eq("id", profile.client_id).single(),
      sb.from("stock_records").select("id,client_id,esc,rub,date_entree,colis,poids_brut,statut,date_sortie,num_dossier,emplacement,date_inventaire").eq("client_id", profile.client_id).order("date_entree", {ascending:false})
    ]);
    if (cr.error || sr.error) { stats.textContent = "Impossible de charger votre stock. Vérifiez les droits RLS et votre association client."; return; }
    clients = cr.data ? [cr.data] : []; records = sr.data || [];
    const name = clients[0]?.name || "Espace Client";
    panel.querySelector("h1").textContent = name;
    panel.querySelector("p").textContent = `Bienvenue ${name} — consultation de votre stock uniquement.`;
  }
  if (isStaff) {
    panel.querySelector("p").textContent = "Accès interne IPSEN — consultation et suivi uniquement, sans modification du stock.";
  }
  const clientNames = Object.fromEntries(clients.map(c => [c.id, c.name]));
  const exportPdfBtn=panel.querySelector("#exportEscalesPdf");
  if(exportPdfBtn){
    exportPdfBtn.addEventListener("click",()=>{
      // Exporter exactement les lignes actuellement visibles après application des filtres et du tri.
      const list=[...(panel._filteredStockRecords||[])];
      const esc=v=>String(v??"—").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
      const today=todayTunisKey();
      const rows=list.map(r=>{
        const isDelivered=/livr/i.test(r.statut||"")||!!r.date_sortie;
        const days=isDelivered?"—":daysSinceEntry(r.date_entree);
        const deliveryDate=isDelivered?(r.date_sortie||"—"):"—";
        const dayStyle=days===null?"":"background:"+(days>60?"#fee2e2":days>=50?"#fef3c7":"#dcfce7")+";color:"+(days>60?"#991b1b":days>=50?"#92400e":"#166534")+";font-weight:700";
        return `<tr><td>${esc(clientNames[r.client_id]||"—")}</td><td>${esc(r.esc)}</td><td>${esc(r.rub)}</td><td>${esc(r.date_entree)}</td><td style="${dayStyle}">${esc(days===null?"—":`${days} jour(s)`)}</td><td>${esc(r.colis)}</td><td>${esc(r.poids_brut)}</td><td>${esc(r.statut||"En cours")}</td><td>${esc(deliveryDate)}</td><td>${esc(r.num_dossier||"—")}</td></tr>`;
      }).join("");
      const popup=window.open("","_blank","width=1100,height=800");
      if(!popup){alert("Autorisez les fenêtres pop-up pour exporter le PDF.");return;}
      const logoUrl=new URL("images.png",document.baseURI).href;
      popup.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>État des escales IPSEN</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:22px;color:#183047}.report-header{display:flex;align-items:center;gap:18px;border-bottom:2px solid #285b83;padding-bottom:12px;margin-bottom:18px}.report-header img{max-width:170px;max-height:70px;object-fit:contain}.brand{font-size:20px;font-weight:700;letter-spacing:1px;color:#17466b}h1{font-size:19px;color:#102a43;margin:18px 0 6px}p{color:#64748b;font-size:12px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #d8e1e8;padding:6px;text-align:left}th{background:#edf3f9;color:#183047}@media print{button{display:none}body{margin:12mm}.report-header img{max-height:58px}}</style></head><body><header class="report-header"><img src="${esc(logoUrl)}" alt="Logo IPSEN" onerror="this.style.display='none'"><div class="brand">IPSEN LOGISTICS</div></header><h1>ÉTAT DES ESCALES</h1><p>Export du ${new Date().toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"})} — ${list.length} escale(s)</p><table><thead><tr><th>Client</th><th>ESC</th><th>RUB</th><th>Date entrée</th><th>Jours au parc</th><th>Colis</th><th>Poids brut</th><th>Statut</th><th>Date livraison</th><th>N° dossier</th></tr></thead><tbody>${rows||'<tr><td colspan="10">Aucune escale à exporter</td></tr>'}</tbody></table><button onclick="window.print()" style="margin-top:18px;padding:10px 16px">Imprimer / Enregistrer en PDF</button><script>window.onload=()=>window.print()<\/script></body></html>`);
      popup.document.close();
    });
  }
  if (isAdmin) {
    const accountPanel = panel.querySelector("#accountCreationPanel");
    const accountBtn = panel.querySelector("#manageAccountsBtn");
    const accountForm = panel.querySelector("#accountCreationForm");
    const roleSelect = panel.querySelector("#newAccountRole");
    const clientWrap = panel.querySelector("#newAccountClientWrap");
    const clientSelect = panel.querySelector("#newAccountClient");
    const accountMsg = panel.querySelector("#accountCreationMsg");
    clients.forEach(c => { const o=document.createElement("option"); o.value=c.id; o.textContent=c.name; clientSelect.appendChild(o); });
    const interiorAccountSelect = panel.querySelector("#newAccountInteriorClient");
    const interiorAccountWrap = panel.querySelector("#newAccountInteriorClientWrap");
    const {data: interiorAccountClients, error: interiorAccountClientsError} = await sb.from("interior_clients").select("id,name").order("name");
    if (interiorAccountClientsError) {
      accountMsg.textContent = "Attention : impossible de charger les clients intérieurs : " + interiorAccountClientsError.message;
    } else {
      (interiorAccountClients || []).forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = c.name;
        interiorAccountSelect.appendChild(option);
      });
    }
    const syncAccountRole = () => { const isClient=roleSelect.value==="client"; clientWrap.classList.toggle("hide",!isClient); interiorAccountWrap.classList.toggle("hide",!isClient); clientSelect.required=isClient; };
    roleSelect.addEventListener("change",syncAccountRole); syncAccountRole();
    accountBtn.addEventListener("click",()=>{accountPanel.classList.toggle("hide");panel.querySelector("#newEscaleForm")?.classList.add("hide");panel.querySelector("#importExcelPanel")?.classList.add("hide");});
    panel.querySelector("#cancelAccountCreation").addEventListener("click",()=>{accountPanel.classList.add("hide");accountForm.reset();syncAccountRole();accountMsg.textContent="";});
    accountForm.addEventListener("submit",async(e)=>{
      e.preventDefault();
      const role=roleSelect.value, name=panel.querySelector("#newAccountName").value.trim(), email=panel.querySelector("#newAccountEmail").value.trim().toLowerCase(), password=panel.querySelector("#newAccountPassword").value;
      const client_id=role==="client"?clientSelect.value:null;
      const interior_client_id=role==="client"?(interiorAccountSelect.value||null):null;
      if(!name||!email||password.length<8||(role==="client"&&!client_id)){accountMsg.textContent="Vérifiez les champs obligatoires.";return;}
      const submit=panel.querySelector("#createAccountSubmit");submit.disabled=true;accountMsg.textContent="Création du compte en cours…";
      try {
        const {data:{session}}=await sb.auth.getSession();
        if(!session?.access_token) throw new Error("Session admin introuvable. Reconnectez-vous.");
        const {data,error}=await sb.functions.invoke("create-portal-account",{body:{role,name,email,password,client_id,interior_client_id},headers:{Authorization:`Bearer ${session.access_token}`}});
        if(error) throw new Error(error.message||"Erreur lors de la création.");
        if(data?.error) throw new Error(data.error);
        accountMsg.textContent=`Compte créé avec succès : ${data.email} (${role === "client" ? "Client" : "Staff"}).`;
        accountForm.reset();syncAccountRole();
      } catch(err) { accountMsg.textContent="Échec : "+(err.message||"Erreur inconnue")+(err.context?.json?.error?" — "+err.context.json.error:""); }
      finally { submit.disabled=false; }
    });

    // Gestion sécurisée des mots de passe Client/Staff via Edge Function dédiée.
    const passwordPanel = panel.querySelector("#passwordManagementPanel");
    const passwordBtn = panel.querySelector("#managePasswordsBtn");
    const passwordMsg = panel.querySelector("#passwordManagementMsg");
    const passwordRows = panel.querySelector("#portalAccountsRows");

    async function loadPortalAccounts() {
      passwordMsg.textContent = "Chargement des comptes…";
      passwordRows.replaceChildren();
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session?.access_token) throw new Error("Session admin introuvable. Reconnectez-vous.");
        const { data, error } = await sb.functions.invoke("manage-portal-accounts", {
          body: { action: "list" },
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        if (error) {
          let detail = "";
          try {
            const response = error.context;
            if (response && typeof response.clone === "function") {
              const body = await response.clone().json();
              detail = body?.error || body?.message || "";
            }
          } catch (_) {}
          throw new Error([error.message, detail].filter(Boolean).join(" — "));
        }
        if (data?.error) throw new Error(data.error);

        const accounts = data?.accounts || [];
        if (!accounts.length) {
          passwordRows.innerHTML = '<tr><td colspan="6">Aucun compte Client ou Staff trouvé.</td></tr>';
        } else {
          accounts.forEach(account => {
            const tr = document.createElement("tr");
            const addCell = value => {
              const td = document.createElement("td");
              td.textContent = value || "—";
              tr.appendChild(td);
            };
            addCell(account.name);
            addCell(account.email);
            addCell(account.role === "client" ? "Client" : "Staff");
            addCell(account.client_name);

            const inputCell = document.createElement("td");
            const passwordInput = document.createElement("input");
            passwordInput.type = "password";
            passwordInput.minLength = 8;
            passwordInput.autocomplete = "new-password";
            passwordInput.placeholder = "8 caractères minimum";
            passwordInput.style.margin = "0";
            inputCell.appendChild(passwordInput);
            tr.appendChild(inputCell);

            const actionCell = document.createElement("td");
            const saveButton = document.createElement("button");
            saveButton.type = "button";
            saveButton.className = "btn-green";
            saveButton.textContent = "Enregistrer";
            saveButton.addEventListener("click", async () => {
              const newPassword = passwordInput.value;
              if (newPassword.length < 8) {
                alert("Le nouveau mot de passe doit contenir au moins 8 caractères.");
                return;
              }
              if (!confirm(`Modifier le mot de passe du compte ${account.email} ?`)) return;
              saveButton.disabled = true;
              passwordMsg.textContent = `Modification du mot de passe de ${account.email}…`;
              try {
                const { data: { session: currentSession } } = await sb.auth.getSession();
                if (!currentSession?.access_token) throw new Error("Session admin introuvable. Reconnectez-vous.");
                const { data: result, error: updateError } = await sb.functions.invoke("manage-portal-accounts", {
                  body: { action: "update_password", user_id: account.id, password: newPassword },
                  headers: { Authorization: `Bearer ${currentSession.access_token}` }
                });
                if (updateError) {
                  let detail = "";
                  try {
                    const response = updateError.context;
                    if (response && typeof response.clone === "function") {
                      const body = await response.clone().json();
                      detail = body?.error || body?.message || "";
                    }
                  } catch (_) {}
                  throw new Error([updateError.message, detail].filter(Boolean).join(" — "));
                }
                if (result?.error) throw new Error(result.error);
                passwordInput.value = "";
                passwordMsg.textContent = `Mot de passe modifié avec succès pour ${account.email}.`;
              } catch (err) {
                passwordMsg.textContent = "Échec : " + (err.message || "Erreur inconnue");
              } finally {
                saveButton.disabled = false;
              }
            });
            actionCell.appendChild(saveButton);

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "btn-red";
            deleteButton.textContent = "🗑 Supprimer";
            deleteButton.addEventListener("click", async () => {
              const confirmed = confirm(`Supprimer définitivement le compte ${account.email} ?\n\nCette action supprimera son accès au portail et ne peut pas être annulée. Les données de stock du client ne seront pas supprimées.`);
              if (!confirmed) return;
              const secondConfirm = prompt(`Pour confirmer, saisissez SUPPRIMER :`);
              if (secondConfirm !== "SUPPRIMER") {
                if (secondConfirm !== null) alert("Confirmation incorrecte. Le compte n'a pas été supprimé.");
                return;
              }
              deleteButton.disabled = true;
              saveButton.disabled = true;
              passwordMsg.textContent = `Suppression du compte ${account.email}…`;
              try {
                const { data: { session: currentSession } } = await sb.auth.getSession();
                if (!currentSession?.access_token) throw new Error("Session admin introuvable. Reconnectez-vous.");
                const { data: result, error: deleteError } = await sb.functions.invoke("manage-portal-accounts", {
                  body: { action: "delete_account", user_id: account.id },
                  headers: { Authorization: `Bearer ${currentSession.access_token}` }
                });
                if (deleteError) {
                  let detail = "";
                  try {
                    const response = deleteError.context;
                    if (response && typeof response.clone === "function") {
                      const body = await response.clone().json();
                      detail = body?.error || body?.message || "";
                    }
                  } catch (_) {}
                  throw new Error([deleteError.message, detail].filter(Boolean).join(" — "));
                }
                if (result?.error) throw new Error(result.error);
                passwordMsg.textContent = `Compte ${account.email} supprimé. Les données de stock sont conservées.`;
                await loadPortalAccounts();
              } catch (err) {
                passwordMsg.textContent = "Suppression impossible : " + (err.message || "Erreur inconnue");
                deleteButton.disabled = false;
                saveButton.disabled = false;
              }
            });
            actionCell.appendChild(deleteButton);
            tr.appendChild(actionCell);
            passwordRows.appendChild(tr);
          });
        }
        passwordMsg.textContent = `${accounts.length} compte(s) Client/Staff affiché(s).`;
      } catch (err) {
        passwordMsg.textContent = "Impossible de charger les comptes : " + (err.message || "Erreur inconnue");
        passwordRows.innerHTML = '<tr><td colspan="6">Vérifiez le déploiement de la fonction manage-portal-accounts.</td></tr>';
      }
    }

    passwordBtn.addEventListener("click", () => {
      passwordPanel.classList.toggle("hide");
      accountPanel.classList.add("hide");
      panel.querySelector("#newEscaleForm")?.classList.add("hide");
      panel.querySelector("#importExcelPanel")?.classList.add("hide");
      if (!passwordPanel.classList.contains("hide")) loadPortalAccounts();
    });
    panel.querySelector("#refreshPortalAccounts").addEventListener("click", loadPortalAccounts);
  }
  // Remplir la liste du formulaire « Nouvelle escale » avec les clients chargés depuis Supabase.
  const escaleClientSelect = panel.querySelector("#eClient");
  if (isAdmin && escaleClientSelect) {
    clients.forEach(c => {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.name;
      escaleClientSelect.appendChild(option);
    });
    if (clients.length === 0) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Aucun client disponible";
      option.disabled = true;
      escaleClientSelect.appendChild(option);
    }
  }
  const addClientBtn=panel.querySelector("#addClientBtn");
  if(isAdmin && addClientBtn && escaleClientSelect){
    addClientBtn.addEventListener("click",async()=>{
      const rawName=window.prompt("Nom du nouveau client :");
      if(rawName===null)return;
      const name=rawName.trim().replace(/\s+/g," ");
      if(!name){alert("Veuillez saisir le nom du client.");return;}

async function addInventoryReminderModule(parent, clientNames) {

  parent.appendChild(section);

  async function refresh(){
    rows.replaceChildren();
    const [outside,inside]=await Promise.all([
      sb.from("stock_records").select("id,client_id,esc,date_entree,statut,date_sortie,date_inventaire"),
      sb.from("interior_stock_records").select("id,client_id,esc,date_entree,statut,date_sortie,date_inventaire")

      });
      td.appendChild(btn);tr.appendChild(td);rows.appendChild(tr);
    });

  await refresh();
}

async function addExitRequestsModule(parent, clientNames) {
  const section=document.createElement("section");
  section.className="card hide";
  section.style.marginTop="20px";
  section.innerHTML=`<div class="toolbar"><div><h1>🔔 Demandes de sortie des clients</h1><p>Les demandes restent actives pendant 7 jours à compter de leur date de création. Ensuite, elles passent automatiquement dans l'historique sans être supprimées.</p></div><button type="button" id="refreshRequests" class="btn-light">Actualiser</button></div>
    <h3>📥 Liste des demandes actives (7 derniers jours)</h3>

    <p id="requestMsg" role="status"></p>
    <details id="requestHistory" style="margin-top:22px">
      <summary style="cursor:pointer;font-weight:800;color:#07518f;padding:12px;background:#edf6ff;border-radius:10px">📚 Historique des demandes archivées automatiquement</summary>
      <p style="color:#64748b">Demandes de plus de 7 jours. Elles restent consultables, mais ne peuvent plus être acceptées ou refusées depuis la liste active.</p>
      <div class="table-wrap"><table><thead><tr><th>Client</th><th>ESC</th><th>Demandée le</th><th>Statut</th><th>Archivage</th></tr></thead><tbody id="requestHistoryRows"><tr><td colspan="5">Chargement…</td></tr></tbody></table></div>
    </details>`;
  parent.appendChild(section);
  const rows=section.querySelector("#requestRows"), historyRows=section.querySelector("#requestHistoryRows"), msg=section.querySelector("#requestMsg");
  const statusLabels={pending:"En attente",approved:"Acceptée",rejected:"Refusée"};
  function requestDate(item){
    return item.created_at?new Date(item.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short",timeZone:"Africa/Tunis"}):"Date inconnue";
  }
  async function refreshRequests(){
    rows.replaceChildren();
    historyRows.replaceChildren();
    const {data,error}=await sb.from("exit_requests").select("id,client_id,stock_esc,status,created_at").order("created_at",{ascending:false}).limit(1000);
    const badge=parent.querySelector("#exitRequestsBadge");
    if(error){
      if(badge){badge.textContent="!";badge.style.display="block";}
      rows.innerHTML='<tr><td colspan="5">Impossible de charger les demandes. Vérifiez que la table exit_requests existe et que les politiques RLS autorisent l’administrateur à lire les demandes.</td></tr>';
      historyRows.innerHTML='<tr><td colspan="5">Historique indisponible.</td></tr>';
      msg.textContent="";
      return;
    }
    const cutoff=Date.now()-(7*24*60*60*1000);
    const active=[], archived=[];
    (data||[]).forEach(item=>{
      const created=item.created_at?Date.parse(item.created_at):NaN;
      if(Number.isFinite(created)&&created>=cutoff) active.push(item);
      else archived.push(item);
    });
    const pendingCount=active.filter(item=>item.status==="pending").length;
    if(badge){badge.textContent=pendingCount>99?"99+":String(pendingCount);badge.style.display=pendingCount>0?"block":"none";}
    if(!active.length){
      rows.innerHTML='<tr><td colspan="5">Aucune demande active pendant les 7 derniers jours.</td></tr>';
    } else {
      active.forEach(item=>{
        const tr=document.createElement("tr");
        [clientNames[item.client_id]||"Client",item.stock_esc||"—",requestDate(item),statusLabels[item.status]||item.status||"Nouvelle"].forEach(v=>tr.appendChild(cell(v)));
        const actionTd=document.createElement("td");
        if(item.status==="pending"){
          const approve=document.createElement("button");
          approve.type="button"; approve.className="btn-green"; approve.textContent="✓ Accepter";
          approve.addEventListener("click",()=>updateRequest(item,"approved",approve));
          const reject=document.createElement("button");
          reject.type="button"; reject.className="btn-red"; reject.textContent="✕ Refuser";
          reject.addEventListener("click",()=>updateRequest(item,"rejected",reject));
          actionTd.append(approve,reject);
        } else {
          actionTd.textContent="—";
        }
        tr.appendChild(actionTd);
        rows.appendChild(tr);
      });
    }
    if(!archived.length){
      historyRows.innerHTML='<tr><td colspan="5">Aucune demande archivée pour le moment.</td></tr>';
    } else {
      archived.forEach(item=>{
        const tr=document.createElement("tr");
        [clientNames[item.client_id]||"Client",item.stock_esc||"—",requestDate(item),statusLabels[item.status]||item.status||"Nouvelle","Archivée (> 7 jours)"].forEach(v=>tr.appendChild(cell(v)));
        historyRows.appendChild(tr);

    }
    msg.textContent=`${active.length} demande(s) active(s), dont ${pendingCount} en attente. ${archived.length} demande(s) dans l'historique.`;
  }
  async function updateRequest(item,newStatus,button){
    const actionText=newStatus==="approved"?"accepter":"refuser";
    if(!confirm(`Confirmer : ${actionText} la demande pour l'escale ${item.stock_esc||"—"} ?`))return;
    button.disabled=true;
    const {error}=await sb.from("exit_requests").update({status:newStatus}).eq("id",item.id);
    if(error){
      alert("La demande n'a pas été mise à jour. Vérifiez la politique RLS UPDATE pour les administrateurs. Détail : "+error.message);
      button.disabled=false;
      return;
    }
    msg.textContent=newStatus==="approved"?"Demande acceptée.":"Demande refusée.";
    await refreshRequests();
  }
  section.querySelector("#refreshRequests").addEventListener("click",refreshRequests);
  await refreshRequests();
}

function tunisDateKey(value) {
  if (!value) return "";
  const date = new Date(value);
  if (!Number.isFinite(date.getTime())) return "";
  return new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).format(date);
}
function todayTunisKey() {
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const part = type => parts.find(item => item.type === type)?.value || "";
  return `${part("year")}-${part("month")}-${part("day")}`;
}
function daysSinceEntry(value) {
  if (!value) return null;
  // Supabase DATE values are YYYY-MM-DD; also tolerate ISO timestamps.
  const raw = String(value).trim();
  let match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  // Also tolerate dates entered/imported as DD/MM/YYYY or DD-MM-YYYY.
  if (!match) {
    const alternate = raw.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{4})$/);
    if (alternate) match = [alternate[0], alternate[3], alternate[2], alternate[1]];
  }
  if (!match) return null;
  const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
  const entry = Date.UTC(year, month - 1, day);
  const [todayYear, todayMonth, todayDay] = todayTunisKey().split("-").map(Number);
  const today = Date.UTC(todayYear, todayMonth - 1, todayDay);
  if (![year,month,day,todayYear,todayMonth,todayDay].every(Number.isFinite) || !Number.isFinite(entry) || !Number.isFinite(today)) return null;
  return Math.floor((today - entry) / 86400000);
}
function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString("fr-FR", {dateStyle:"short", timeStyle:"short", timeZone:"Africa/Tunis"});
}
function duration(entry, exit) {
  if (!entry) return "—";
  // Parse timestamps safely and avoid displaying negative durations.
  const start = Date.parse(entry);
  const end = exit ? Date.parse(exit) : Date.now();
  if (!Number.isFinite(start) || !Number.isFinite(end)) return "—";
  const totalMinutes = Math.max(0, Math.floor((end - start) / 60000));
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return `${days} j ${hours} h ${minutes} min`;
  if (hours > 0) return `${hours} h ${minutes} min`;
  return `${minutes} min`;
}

    w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bon de déchargement – TRANSALIA</title><style>
      *{box-sizing:border-box}
      @page{size:A4 portrait;margin:14mm}
      body{margin:0;background:#eef3f8;font-family:Arial,Helvetica,sans-serif;color:#172b45}
      .sheet{width:100%;max-width:190mm;min-height:267mm;margin:18px auto;background:#fff;padding:13mm 12mm;border:1px solid #d8e2ee;border-radius:12px;box-shadow:0 8px 28px rgba(20,48,78,.10)}
      .topline{height:5px;background:linear-gradient(90deg,#0b3d70 0 50%,#b32645 50% 100%);border-radius:8px;margin-bottom:20px}
      .brand-logos{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:4px 12px 18px;margin-bottom:12px;border-bottom:1px solid #e2eaf2}
      .brand-logos img{display:block;object-fit:contain;height:72px;max-width:43%}
      .brand-logos .ipsen-logo{width:42%;height:88px;max-width:42%}
      .brand-logos .transalia-logo{width:42%;height:72px}
      .title{color:#0b3768;text-align:center;font-size:22px;font-weight:800;letter-spacing:.4px;padding:14px 8px;margin:8px 0 18px;border-top:2px solid #0b3768;border-bottom:2px solid #0b3768}
      .meta{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;background:#f0f5fa;border:1px solid #dce7f1;border-radius:8px;font-size:14px;margin-bottom:20px}
      .ref{font-size:14px;margin:0 0 15px;padding:0 2px}
      .ref b{color:#0b3768}
      table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
      th{background:#0b3768;color:#fff;padding:12px 9px;text-align:center;font-size:12px;letter-spacing:.2px}
      td{border:1px solid #d4deea;padding:13px 9px;text-align:center}
      tbody tr:nth-child(even){background:#f6f9fc}
      td.container{font-weight:700;letter-spacing:.3px}
      .total{margin-top:20px;padding:15px;text-align:center;background:#edf4fb;border:1px solid #d9e6f3;border-left:5px solid #0b3768;border-radius:8px;color:#0b3768;font-size:19px;font-weight:800}
      .signature{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:42px}
      .signbox{height:76px;border:1px solid #d6e0eb;border-radius:7px;padding:10px;font-size:12px;color:#53677e}
      .foot{margin-top:24px;padding-top:10px;border-top:1px solid #e4ebf2;text-align:center;font-size:10px;color:#718096}
      .print{display:block;margin:16px auto;padding:12px 22px;border:0;border-radius:8px;background:#0b5e9f;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
      @media print{body{background:#fff}.sheet{max-width:none;min-height:0;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}.print{display:none}.topline{margin-bottom:16px}}

  async function refreshReturnBons(){
    const {data,error}=await sb.from("container_return_bons").select("id,container_movement_id,container_number,received_at,image_path").order("received_at",{ascending:false});
    if(error){ if(el("cBonMsg")) el("cBonMsg").textContent="Pour activer les bons de restitution, exécutez le script SQL fourni avec ce fichier. Détail : "+error.message; return; }
    returnBons=data||[];
    renderReturnBons();
  }
  async function renderReturnBons(){
    if(!el("cBonRows"))return;
    const exited=movements.filter(x=>x.exit_at);
    const receivedIds=new Set(returnBons.map(x=>x.container_movement_id));
    const pending=exited.filter(x=>!receivedIds.has(x.id));
    el("cBonPending").textContent=pending.length;
    el("cBonReceived").textContent=exited.length-pending.length;
    const tbody=el("cBonRows");tbody.replaceChildren();
    for(const m of exited){
      const bon=returnBons.find(x=>x.container_movement_id===m.id);
      const tr=document.createElement("tr");
      const vals=[m.container_number,formatDate(m.exit_at),bon?"Validé":"En attente"];
      vals.forEach((v,i)=>{const td=document.createElement("td");td.textContent=v||"—";if(i===2)td.style.color=bon?"#138a62":"#b45309";tr.appendChild(td);});
      const action=document.createElement("td");
      if(!readOnly&&!bon){const btn=document.createElement("button");btn.type="button";btn.textContent="Valider";btn.style.cssText="background:#138a62;color:white;border:0;border-radius:6px;padding:7px 10px;cursor:pointer";btn.addEventListener("click",()=>validateReturnBon(m,btn));action.appendChild(btn);}else action.textContent=bon?"Validé":"Consultation seule";
      tr.appendChild(action);tbody.appendChild(tr);
    }
    if(!exited.length){const tr=document.createElement("tr");const td=document.createElement("td");td.colSpan=4;td.textContent="Aucune sortie enregistrée.";tr.appendChild(td);tbody.appendChild(tr);}
  }
  async function validateReturnBon(m,button){
    if(!window.confirm(`Confirmer la réception du bon de restitution pour ${m.container_number} ?`))return;
    button.disabled=true;button.textContent="Validation…";el("cBonMsg").textContent="Enregistrement de la validation…";
    try{
      const user=(await sb.auth.getUser()).data.user;if(!user)throw new Error("Session utilisateur introuvable.");
      const ins=await sb.from("container_return_bons").insert({container_movement_id:m.id,container_number:m.container_number,received_at:new Date().toISOString(),created_by:user.id});
      if(ins.error)throw ins.error;
      el("cBonMsg").textContent=`Bon de restitution validé pour ${m.container_number}.`;await refreshReturnBons();
    }catch(err){el("cBonMsg").textContent="Impossible de valider : "+(err.message||"vérifiez la table container_return_bons et les droits RLS.");}
    finally{button.disabled=false;button.textContent="Valider";}
  }
  async function refresh() {
    const {data,error}=await sb.from("container_movements").select("id,container_number,container_company,container_type,has_damage,exit_has_damage,truck_registration,exit_truck_registration,entry_at,exit_at,notes,status,handled_by,intervention_code").order("entry_at",{ascending:false}).limit(500);
    if(error){el("cMsg").textContent="Tableau conteneurs indisponible. Exécutez le script SQL fourni et vérifiez les droits RLS."; return;}
    movements=data||[];
    await refreshReturnBons();
    const today=new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
    el("cInside").textContent=movements.filter(x=>!x.exit_at).length;
    el("cTodayIn").textContent=movements.filter(x=>x.entry_at&&new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date(x.entry_at))===today).length;
    el("cTodayOut").textContent=movements.filter(x=>x.exit_at&&new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Tunis", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date(x.exit_at))===today).length;
    renderRows();
    renderTransaliaArchive();
    updateTransaliaInterventionUI();
  }
  function renderRows(){
    const normalizeSearch = value => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    const q=normalizeSearch(el("cSearch").value), tbody=el("cRows"); tbody.replaceChildren();
    const today=todayTunisKey();
    const dateFrom=el("cDateFrom")?.value||"";
    const dateTo=el("cDateTo")?.value||"";
    const statusFilter=el("cStatusFilter")?.value||"all";
    const filtered=movements.filter(x=>{
      const matchesQuick=!containerQuickFilter||(containerQuickFilter==="inside"?!x.exit_at:containerQuickFilter==="todayIn"?tunisDateKey(x.entry_at)===today:containerQuickFilter==="todayOut"?tunisDateKey(x.exit_at)===today:false);
      if(!matchesQuick)return false;
      if(statusFilter==="entry" && !x.entry_at)return false;
      if(statusFilter==="exit" && !x.exit_at)return false;
      if(statusFilter==="inside" && x.exit_at)return false;
      const eventDate=statusFilter==="exit"?tunisDateKey(x.exit_at):tunisDateKey(x.entry_at);
      if(dateFrom && (!eventDate || eventDate<dateFrom))return false;
      if(dateTo && (!eventDate || eventDate>dateTo))return false;
      if(!q) return true;
      const values=[
        x.container_number, x.container_company, x.container_type ? `${x.container_type} pieds` : "",
        x.has_damage, x.exit_has_damage, x.truck_registration, x.exit_truck_registration,
        formatDate(x.entry_at), formatDate(x.exit_at), duration(x.entry_at,x.exit_at),
        x.exit_at ? "Sorti" : "Dans le parc", x.status, x.notes,
        x.entry_at ? new Date(x.entry_at).toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"}) : "",
        x.exit_at ? new Date(x.exit_at).toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"}) : "",
        x.entry_at ? new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(x.entry_at)) : "",
        x.exit_at ? new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Tunis",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(x.exit_at)) : ""
      ];
      return values.some(value=>normalizeSearch(value).includes(q));
    });
    lastFilteredMovements=filtered;
    filtered.forEach(x=>{
      const tr=document.createElement("tr");
      const vals=[x.container_number,x.container_company||"—",x.container_type?`${x.container_type} pieds`:"—",x.has_damage??"—",x.exit_has_damage??(x.exit_at?"Non renseigné":"—"),x.truck_registration||"—",x.exit_truck_registration|| (x.exit_at?"Non renseigné":"—"),formatDate(x.entry_at),formatDate(x.exit_at),duration(x.entry_at,x.exit_at),x.exit_at?"Sorti":"Dans le parc"];
      vals.forEach(v=>tr.appendChild(cell(v)));
      const actionCell=document.createElement("td");
      if (readOnly) {
        actionCell.textContent="Consultation seule";
      } else {
        const edit=document.createElement("button");
        edit.type="button"; edit.textContent="Modifier";
        edit.style.cssText="background:#2563eb;color:#fff;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap;margin:0 4px 4px 0";
        edit.addEventListener("click",()=>editMovement(x,edit));
        actionCell.appendChild(edit);
        const del=document.createElement("button");
        del.type="button"; del.textContent="Effacer";
        del.style.cssText="background:#b91c1c;color:#fff;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap";
        del.addEventListener("click",()=>deleteMovement(x,del));
        actionCell.appendChild(del);
      }
      tr.appendChild(actionCell); tbody.appendChild(tr);
    });
    el("cCount").textContent=`${filtered.length} mouvement(s) affiché(s)`;
  }
  async function editMovement(movement, button){
    // Admin only: correct common data-entry mistakes while keeping the existing movement record.
    const ask=(label,current)=>window.prompt(label,current==null?"":String(current));
    const number=ask("Numéro du conteneur :",movement.container_number);
    if(number===null)return;
    const cleanNumber=number.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z]{4}[A-Z0-9]{7}$/.test(cleanNumber)){alert("Numéro invalide : format habituel 4 lettres + 7 caractères.");return;}
    const company=ask("Compagnie du conteneur à l'entrée :",movement.container_company||"");
    if(company===null)return;
    if(!company.trim()){alert("Veuillez saisir la compagnie du conteneur.");return;}
    const type=ask("Type de conteneur (20, 40 ou 45 pieds) :",movement.container_type||"40");
    if(type===null)return;
    if(!["20","40","45"].includes(type.trim())){alert("Le type doit être 20, 40 ou 45.");return;}
    const damageIn=ask("Dégâts à l'entrée (Oui/Non) :",movement.has_damage||"Non");
    if(damageIn===null)return;
    if(!["oui","non"].includes(damageIn.trim().toLowerCase())){alert("Indiquez Oui ou Non pour les dégâts à l'entrée.");return;}
    const truckIn=ask("Matricule camion / transporteur à l'entrée :",movement.truck_registration||"");
    if(truckIn===null)return;
    let damageOut=movement.exit_has_damage, truckOut=movement.exit_truck_registration;
    if(movement.exit_at){
      damageOut=ask("Dégâts à la sortie (Oui/Non) :",movement.exit_has_damage||"Non");
      if(damageOut===null)return;
      if(!["oui","non"].includes(damageOut.trim().toLowerCase())){alert("Indiquez Oui ou Non pour les dégâts à la sortie.");return;}
      truckOut=ask("Matricule camion / transporteur à la sortie :",movement.exit_truck_registration||"");
      if(truckOut===null)return;
    }
    if(!window.confirm("Enregistrer les corrections de ce mouvement ?"))return;
    button.disabled=true;button.textContent="Enregistrement…";el("cMsg").textContent="Mise à jour du mouvement…";
    try{
      const changes={container_number:cleanNumber,container_company:company.trim(),container_type:type.trim(),has_damage:damageIn.trim().toLowerCase()==="oui"?"Oui":"Non",truck_registration:truckIn.trim()||null};
      if(movement.exit_at){
        changes.exit_has_damage=damageOut.trim().toLowerCase()==="oui"?"Oui":"Non";
        changes.exit_truck_registration=truckOut.trim()||null;
      }
      const {error}=await sb.from("container_movements").update(changes).eq("id",movement.id);
      if(error)throw error;
      el("cMsg").textContent=`Mouvement ${cleanNumber} modifié avec succès.`;
      await refresh();
    }catch(err){
      el("cMsg").textContent="Modification refusée : "+(err.message||"vérifiez les autorisations UPDATE (RLS) dans Supabase.");
    }finally{button.disabled=false;button.textContent="Modifier";}
  }
  async function deleteMovement(movement, button){
    const label=`${movement.container_number} — entrée ${formatDate(movement.entry_at)}`;
    if(!window.confirm(`Supprimer définitivement ce mouvement ?\n${label}\nCette action est irréversible.`)) return;
    button.disabled=true; button.textContent="Suppression…";
    el("cMsg").textContent="Suppression du mouvement…";
    try{
      const {error}=await sb.from("container_movements").delete().eq("id",movement.id);
      if(error) throw error;
      el("cMsg").textContent=`Mouvement ${movement.container_number} supprimé.`;
      await refresh();
    }catch(err){
      el("cMsg").textContent="Suppression refusée : "+(err.message||"vérifiez les autorisations DELETE (RLS) dans Supabase.");
      button.disabled=false; button.textContent="Effacer";
    }
  }
  el("cSearch").addEventListener("input",renderRows);
  // Saisie manuelle prioritaire : pas de chargement ni d'attente OCR.
  if (!readOnly) {
    el("cNumber").addEventListener("input", () => {
      el("cNumber").value = el("cNumber").value.toUpperCase().replace(/\s+/g, "");
    });
    el("cNumber").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveMovement("entry");
      }
    });
  }
  async function saveMovement(action){
    const number=el("cNumber").value.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z]{4}[A-Z0-9]{7}$/.test(number)){el("cMsg").textContent="Vérifiez le numéro : format habituel 4 lettres + 7 caractères.";return;}
    if(action==="entry" && (!el("cType").value || !el("cDamage").value || !el("cCompany").value.trim() || !el("cTruck").value.trim())){el("cMsg").textContent="Renseignez la compagnie du conteneur, le type, les dégâts et le matricule camion.";return;}
    const handledBy=el("cHandledBy")?.value||"IPSEN";
    if(action==="entry" && handledBy==="TRANSALIA" && !activeTransaliaIntervention){el("cMsg").textContent="Démarrez une intervention TRANSALIA avant d'enregistrer ses conteneurs.";return;}
    el("cEntry").disabled=el("cExit").disabled=true;el("cMsg").textContent="Enregistrement…";
    try{
      const active=movements.find(x=>x.container_number===number&&!x.exit_at);
      if(action==="entry"){
        if(active){el("cMsg").textContent="Ce conteneur est déjà enregistré dans le parc. Utilisez la sortie si nécessaire.";return;}
        const {error}=await sb.from("container_movements").insert({container_number:number,container_company:el("cCompany").value.trim(),container_type:el("cType").value,has_damage:el("cDamage").value,truck_registration:el("cTruck").value.trim(),handled_by:handledBy,intervention_code:handledBy==="TRANSALIA"?activeTransaliaIntervention.code:null,client_id:null,created_by:(await sb.auth.getUser()).data.user?.id});
        if(error)throw error;
        el("cMsg").textContent=`Entrée enregistrée pour ${number}. Date et heure générées automatiquement.`;
      }else{
        if(!active){el("cMsg").textContent="Aucune entrée ouverte trouvée pour ce numéro. Vérifiez le numéro ou enregistrez l'entrée.";return;}
        const exitDamage=window.prompt("Dégâts constatés à la sortie ? Tapez Oui ou Non :","Non");
        if(exitDamage===null)return;
        const normalizedExitDamage=exitDamage.trim().toLowerCase();
        if(!["oui","non"].includes(normalizedExitDamage)){el("cMsg").textContent="Réponse invalide : indiquez Oui ou Non pour les dégâts à la sortie.";return;}
        const exitTruck=window.prompt("Matricule du camion / transporteur à la sortie :");
        if(exitTruck===null)return;
        if(!exitTruck.trim()){el("cMsg").textContent="Veuillez saisir le matricule du camion / transporteur à la sortie.";return;}
        const exitAt=new Date().toISOString();
        const {error}=await sb.from("container_movements").update({exit_at:exitAt,exit_has_damage:normalizedExitDamage==="oui"?"Oui":"Non",exit_truck_registration:exitTruck.trim(),status:"sorti"}).eq("id",active.id).is("exit_at",null);
        if(error)throw error;
        el("cMsg").textContent=`Sortie enregistrée pour ${number}. Dégâts à la sortie : ${normalizedExitDamage==="oui"?"Oui":"Non"}. Durée dans le parc : ${duration(active.entry_at,exitAt)}.`;
      }
      el("cNumber").value="";if(action==="entry"){el("cTruck").value="";el("cCompany").value="";el("cDamage").value="Non";el("cType").value="40";}el("cNumber").focus();await refresh();
    }catch(err){el("cMsg").textContent="Erreur d'enregistrement : "+(err.message||"vérifiez la table et les autorisations Supabase.");}
    finally{el("cEntry").disabled=el("cExit").disabled=false;}
  }
  ["cSearch","cDateFrom","cDateTo","cStatusFilter"].forEach(id=>el(id)?.addEventListener(id==="cSearch"?"input":"change",renderRows));
  el("cResetFilters")?.addEventListener("click",()=>{
    el("cSearch").value=""; el("cDateFrom").value=""; el("cDateTo").value="";
    el("cStatusFilter").value="all"; containerQuickFilter=""; renderRows();
  });
  el("cPrintFiltered")?.addEventListener("click",()=>{
    if(!lastFilteredMovements.length){alert("Aucun conteneur à imprimer pour ces filtres.");return;}
    const esc=value=>String(value??"—").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    const rows=lastFilteredMovements.map(x=>`<tr><td>${esc(x.container_number)}</td><td>${esc(x.container_company)}</td><td>${esc(x.container_type?x.container_type+" pieds":"—")}</td><td>${esc(formatDate(x.entry_at))}</td><td>${esc(formatDate(x.exit_at))}</td><td>${esc(duration(x.entry_at,x.exit_at))}</td><td>${esc(x.exit_at?"Sorti":"Dans le parc")}</td></tr>`).join("");
    const w=window.open("","_blank","width=1100,height=750");
    if(!w){alert("Autorisez les fenêtres pop-up pour imprimer.");return;}
    w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste des conteneurs - IPSEN</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#263746}h1{color:#17466b}p{color:#526579}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ccd6df;padding:8px;text-align:left}th{background:#edf3f8}@media print{button{display:none}}</style></head><body><h1>IPSEN LOGISTICS — Liste des conteneurs</h1><p>Édité le ${new Date().toLocaleString("fr-FR")} — ${lastFilteredMovements.length} résultat(s)</p><table><thead><tr><th>N° conteneur</th><th>Compagnie</th><th>Type</th><th>Entrée</th><th>Sortie</th><th>Durée</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);
    w.document.close();
  });
  if (!readOnly) {
    el("cEntry").addEventListener("click",()=>saveMovement("entry"));
    el("cExit").addEventListener("click",()=>saveMovement("exit"));
  }
  updateTransaliaInterventionUI();
  await refresh();
}
form.addEventListener("submit", async (e) => {
  e.preventDefault(); message.textContent = "Connexion...";
  const {data, error} = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) { message.textContent = "Erreur de connexion : vérifiez l'e-mail et le mot de passe."; return; }
  const {data: profile, error: pError} = await sb.from("profiles").select("role,client_id,interior_client_id").eq("id", data.user.id).single();
  if (pError || !profile) { message.textContent = "Profil introuvable. Contactez l'administrateur IPSEN."; await sb.auth.signOut(); return; }
  await loadPortal(data.user, profile);
});
// Reprendre la session si l'utilisateur actualise la page.
(async () => {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return;
  const {data: profile, error} = await sb.from("profiles").select("role,client_id,interior_client_id").eq("id", session.user.id).single();
  if (!error && profile) await loadPortal(session.user, profile);
})();
</script>
 </body>
