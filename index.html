
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPSEN - Portail Clients</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#183047}
header{background:#123b5d;color:white;padding:22px}
main{max-width:850px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 15px #0001}
h1{margin-top:0}p{color:#637386;line-height:1.6}
input{display:block;width:100%;box-sizing:border-box;padding:13px;margin:10px 0;border:1px solid #ccd5df;border-radius:7px}
button{background:#147d64;color:white;border:0;padding:13px 18px;border-radius:7px;font-weight:bold}
footer{text-align:center;padding:25px;color:#637386;font-size:13px}
</style>
</head>
<body>
<header>
<h2>IPSEN | PORTAIL CLIENTS</h2>
<div>Suivi du stock et des opérations logistiques</div>
</header>
<main>
<section class="card">
<h1>Bienvenue sur votre portail</h1>
<p>Consultez vos informations logistiques depuis un espace sécurisé.</p>
<h3>Connexion client</h3>
<form id="login">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" placeholder="Votre e-mail" required>
<label for="password">Mot de passe</label>
<input id="password" type="password" placeholder="Votre mot de passe" required>
<button type="submit">Se connecter</button>
<p id="message"></p>
</form>
</section>
</main>
<footer>IPSEN Logistics — Portail de consultation du stock</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lyzxhpkpboqsluuyrypr.supabase.co";
const SUPABASE_KEY = "sb_publishable_4FS53EVOwmQ9GHyPB241mA_5JE64o12";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.textContent = "Connexion en cours...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "Erreur de connexion : vérifiez votre e-mail et votre mot de passe.";
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("role, client_id")
    .eq("id", data.user.id)
    .single();

  if (profileError || !profile) {
    message.textContent = "Profil introuvable. Contactez l'administrateur.";
    await supabaseClient.auth.signOut();
    return;
  }

  if (profile.role === "admin") {
    message.textContent = "Connexion réussie — compte administrateur.";
  } else {
    message.textContent = "Connexion réussie — compte client.";
  }

  // On garde la session ouverte pour les prochaines étapes.
});
</script>
  
</body>
</html>
